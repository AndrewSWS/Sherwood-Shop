<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="apple-touch-icon" href="icon_driver.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Driver Schedule">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Sherwood Steel — Driver Schedule</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #f0f2f7; --surface: #fff; --card: #fff;
    --border: #d0d5e8; --text: #1a1f35; --text2: #4a5270; --text3: #8892b0;
    --blue: #2d6bb5; --green: #2e8f5e; --amber: #c47a00; --red: #c93535;
    --radius: 12px; --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

  /* Header */
  #header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 14px 16px; display: flex; align-items: center; gap: 12px;
    position: sticky; top: 0; z-index: 100;
  }
  #header .logo { font-size: 18px; font-weight: 900; color: var(--text); flex: 1; }
  #header .logo span { color: var(--blue); }
  #sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text3); flex-shrink: 0; }
  #sync-dot.green { background: var(--green); }
  #sync-dot.amber { background: var(--amber); }
  #sync-dot.red   { background: var(--red); }

  /* Truck selector */
  #truck-bar {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 12px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  #truck-bar label { font-size: 13px; color: var(--text2); font-weight: 600; }
  #truck-select {
    flex: 1; min-width: 200px; background: var(--card); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 10px 14px; font-size: 15px; font-weight: 700; -webkit-appearance: none;
  }
  #date-display {
    font-size: 13px; color: var(--blue); font-weight: 700; white-space: nowrap;
  }

  /* Date nav */
  #date-nav {
    display: flex; align-items: center; gap: 8px;
  }
  #date-nav button {
    background: var(--surface); color: var(--text2); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px; font-size: 16px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #date-nav button:active { opacity: .7; }
  #date-picker {
    background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; font-size: 13px; font-weight: 700;
    flex: 1; text-align: center;
  }
  #today-btn {
    background: var(--blue); color: #fff; border-color: var(--blue);
    font-size: 12px; padding: 8px 10px; font-weight: 700;
  }

  /* Summary bar */
  #summary-bar {
    display: none; align-items: center; flex-wrap: wrap; gap: 8px; padding: 10px 16px;
    background: #e8edf7; border-bottom: 1px solid var(--border);
    font-size: 13px; color: var(--text2);
  }
  #summary-bar .sum-num { color: var(--text); font-weight: 800; font-size: 16px; }

  /* List/Map toggle */
  #view-toggle { display: flex; gap: 6px; margin-left: auto; }
  #view-toggle button {
    background: var(--surface); color: var(--text2); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 700;
    -webkit-tap-highlight-color: transparent;
  }
  #view-toggle button.active { background: var(--blue); color: #fff; border-color: var(--blue); }

  /* Map view */
  #stops-map-wrap { padding: 12px 16px; max-width: 700px; margin: 0 auto; }
  #stops-map { height: 60vh; min-height: 360px; border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; }
  #stops-map-note {
    margin-top: 8px; font-size: 12px; color: var(--amber); background: #fff8e6;
    border: 1px solid #f0c775; border-radius: var(--radius-sm); padding: 8px 10px;
  }
  .stop-map-label { background: #1a1a1a; color: #fff; border: none; border-radius: 4px; padding: 2px 8px; font-size: 11px; font-weight: 700; }
  .stop-map-label::before { border-top-color: #1a1a1a; }

  /* Stop list */
  #stops { padding: 12px 16px; max-width: 700px; margin: 0 auto; }

  .stop-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    margin-bottom: 12px; overflow: hidden; transition: opacity .2s;
  }
  .stop-card.delivered { opacity: 0.55; }
  .stop-card.arrived  { border-color: var(--amber); }

  .stop-header {
    padding: 14px 16px 10px; cursor: pointer;
    display: flex; align-items: flex-start; gap: 12px;
  }
  .stop-num-badge {
    width: 36px; height: 36px; border-radius: 50%; background: #d8def0;
    color: var(--text2); font-size: 14px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .stop-num-badge.arrived  { background: #fff3cc; color: var(--amber); }
  .stop-num-badge.delivered{ background: #d4f0e4; color: var(--green); }

  .stop-info { flex: 1; min-width: 0; }
  .stop-customer { font-size: 20px; font-weight: 900; color: var(--text); line-height: 1.1; margin-bottom: 3px; }
  .stop-address  { font-size: 14px; color: var(--text2); font-weight: 500; margin-bottom: 4px; }
  a.stop-address-link {
    display: flex; align-items: center; gap: 8px;
    background: #e8f0fb; border: 1px solid #b8d0f0; border-radius: 10px;
    padding: 10px 14px; margin-bottom: 8px;
    color: var(--blue); text-decoration: none; font-weight: 700; font-size: 14px;
    -webkit-tap-highlight-color: transparent;
  }
  a.stop-address-link:active { background: #d0e4f8; }
  a.stop-address-link .maps-icon { font-size: 20px; flex-shrink: 0; }
  a.stop-address-link .maps-text { flex: 1; }
  a.stop-address-link .maps-arrow { font-size: 16px; opacity: .5; }
  .stop-meta     { font-size: 12px; color: var(--text3); }

  .stop-status-badge {
    flex-shrink: 0; font-size: 11px; font-weight: 700; padding: 4px 10px;
    border-radius: 20px; white-space: nowrap; align-self: flex-start;
  }
  .badge-pending   { background: #ddeaf8; color: var(--blue); }
  .badge-arrived   { background: #fff3cc; color: var(--amber); }
  .badge-delivered { background: #d4f0e4; color: var(--green); }

  /* Popout line items */
  .stop-detail {
    display: none; border-top: 1px solid var(--border); padding: 12px 16px;
    background: #f7f9fc;
  }
  .stop-detail.open { display: block; }
  .li-row {
    display: flex; gap: 10px; align-items: baseline;
    padding: 6px 0; border-bottom: 1px solid #1e2235; font-size: 13px;
  }
  .li-row:last-child { border-bottom: none; }
  .li-spec { font-size: 16px; font-weight: 800; color: var(--text); flex: 1; }
  .li-qty  { color: var(--blue); font-weight: 700; font-size: 14px; white-space: nowrap; }
  .li-status { font-size: 11px; font-weight: 700; white-space: nowrap; }
  .li-status.complete { color: var(--green); }
  .li-status.inprocess { color: var(--amber); }
  .li-status.pending   { color: var(--text3); }
  .li-notes { font-size: 11px; color: var(--text3); margin-top:2px; }
  .wo-badge { display:inline-flex; align-items:center; gap:4px; background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:2px 10px; font-size:11px; color:var(--text2); margin-bottom:8px; }

  /* Action buttons */
  .stop-actions { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-action {
    flex: 1; min-width: 120px; padding: 14px 10px; border-radius: 10px;
    border: none; font-size: 15px; font-weight: 800; cursor: pointer;
    -webkit-tap-highlight-color: transparent; transition: opacity .15s;
  }
  .btn-action:active { opacity: .75; }
  .btn-arrive   { background: #fff8e1; color: var(--amber); border: 2px solid var(--amber); }
  .btn-deliver  { background: #e8f8f0; color: var(--green); border: 2px solid var(--green); }
  .btn-deliver.active { background: var(--green); color: #fff; }
  .btn-undo     { background: #f0f2f7; color: var(--text2); border: 1px solid var(--border); }

  /* Mileage / driver input row */
  .input-row {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 0 16px 12px; border-top: none;
  }
  .input-row label { font-size: 11px; color: var(--text3); font-weight: 700; text-transform: uppercase; }
  .input-row input {
    background: #f7f9fc; color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px; font-size: 15px; font-weight: 700;
    width: 140px;
  }
  .input-row input::placeholder { color: var(--text3); font-weight: 400; }

  /* Timestamps */
  .timestamps { padding: 8px 16px; font-size: 11px; color: var(--text3); border-top: 1px solid var(--border); }
  .timestamps span { color: var(--text2); font-weight: 600; }

  /* Empty / loading */
  #empty { text-align: center; padding: 60px 20px; color: var(--text3); }
  #empty .icon { font-size: 48px; margin-bottom: 12px; }
  #loading { text-align: center; padding: 40px; color: var(--text3); font-size: 14px; }

  /* Toast */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #1a1f35; color: #fff; border: none;
    border-radius: 20px; padding: 12px 24px; font-size: 14px; font-weight: 700;
    z-index: 9999; opacity: 0; transition: opacity .2s; pointer-events: none;
    max-width: 90vw; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  #toast.show { opacity: 1; }


</style>
</head>
<body>

<div id="header">
  <div class="logo">Sherwood <span>Steel</span> — Delivery</div>
  <div id="sync-dot"></div>
</div>

<div id="truck-bar">
  <label>🚚 Truck</label>
  <select id="truck-select" onchange="selectTruck(this.value)">
    <option value="">— Select Your Truck —</option>
  </select>
</div>
<div id="truck-bar" style="border-top:none;padding-top:8px">
  <div id="date-nav">
    <button onclick="shiftDate(-1)">‹</button>
    <input type="date" id="date-picker" onchange="selectDate(this.value)">
    <button onclick="shiftDate(1)">›</button>
    <button id="today-btn" onclick="goToday()">Today</button>
  </div>
</div>

<div id="summary-bar">
  <span id="summary-text"></span>
  <div id="view-toggle">
    <button id="view-list-btn" class="active" onclick="setScheduleView('list')">List</button>
    <button id="view-map-btn" onclick="setScheduleView('map')">🗺 Map</button>
  </div>
</div>

<div id="stops">
  <div id="loading">Loading schedule...</div>
</div>

<div id="stops-map-wrap" style="display:none">
  <div id="stops-map"></div>
  <div id="stops-map-note" style="display:none"></div>
</div>

<div id="toast"></div>



<script>
const SB_URL = 'https://ecndvwmbycyppqkbvuzs.supabase.co';
const SB_KEY = 'sb_publishable_DPSLNDOI___sDI-lt3YbpQ_TGJbHaV-';
const HDR = { 'Content-Type':'application/json', apikey: SB_KEY, Authorization: 'Bearer '+SB_KEY };
const BENSALEM_LAT = 40.1059;
const BENSALEM_LON = -74.9494;
let scheduleView = 'list'; // 'list' or 'map'
let _stopsMapInstance = null;

// City-level fallback coordinates — shared with index.html via the
// city_coords table (seeded once from index.html's static CITY_COORDS
// object) plus the cityCoordsOverride blob in admin_config (cities
// geocoded on-the-fly for brand-new customers). Loaded ONCE, not on every
// poll — this table barely changes and there's no reason to re-fetch 155+
// rows every 60 seconds.
let CITY_COORDS_MAP = null;
async function loadCityCoordsOnce(){
  if(CITY_COORDS_MAP) return CITY_COORDS_MAP;
  const map = {};
  try {
    const r = await fetch(`${SB_URL}/rest/v1/city_coords?select=city,state,lat,lon`, { headers: HDR });
    const rows = await r.json();
    if(Array.isArray(rows)){
      rows.forEach(row => { map[`${row.city}|${row.state}`] = [Number(row.lat), Number(row.lon)]; });
    }
  } catch(e) { console.warn('city_coords lookup failed', e); }
  try {
    const r2 = await fetch(`${SB_URL}/rest/v1/admin_config?key=eq.cityCoordsOverride&select=value`, { headers: HDR });
    const rows2 = await r2.json();
    if(Array.isArray(rows2) && rows2[0] && rows2[0].value){
      const overrides = typeof rows2[0].value === 'string' ? JSON.parse(rows2[0].value) : rows2[0].value;
      if(overrides && typeof overrides === 'object') Object.assign(map, overrides);
    }
  } catch(e) { console.warn('cityCoordsOverride lookup failed', e); }
  CITY_COORDS_MAP = map;
  return map;
}

let driverName = ''; // pulled from truck record on selection
let activeTruck = localStorage.getItem('sw_truck') || '';
let activeDate  = new Date().toISOString().split('T')[0]; // YYYY-MM-DD
let trucks = [];
let stops = [];
let openStopId = null;
let pollTimer = null;

// ── INIT ──────────────────────────────────────────────────────────────────────
async function init() {
  document.getElementById('date-picker').value = activeDate;
  updateTodayBtn();

  // Load trucks from Supabase
  try {
    const r = await fetch(`${SB_URL}/rest/v1/trucks?order=id`, { headers: HDR });
    if (!r.ok) {
      const err = await r.text();
      showToast('⚠ Trucks error: ' + r.status);
      console.error('Trucks fetch failed:', r.status, err);
      setSyncStatus('red');
      return;
    }
    trucks = await r.json();
    console.log('Trucks loaded:', trucks);
    if (!Array.isArray(trucks) || trucks.length === 0) {
      showToast('No trucks found in system');
      setSyncStatus('amber');
      document.getElementById('stops').innerHTML = '<div id="loading" style="color:var(--amber)">No trucks configured. Set up trucks in the main app first.</div>';
      return;
    }
    const sel = document.getElementById('truck-select');
    sel.innerHTML = '<option value="">— Select Your Truck —</option>';
    trucks.forEach(t => {
      const opt = document.createElement('option');
      opt.value = t.id;
      opt.textContent = t.name + (t.driver ? ' — ' + t.driver : '');
      if (String(t.id) === activeTruck) {
        opt.selected = true;
        if (t.driver) driverName = t.driver;
      }
      sel.appendChild(opt);
    });
    setSyncStatus('green');
  } catch(e) {
    setSyncStatus('red');
    showToast('⚠ Could not load trucks: ' + e.message);
    console.error('Trucks fetch error:', e);
  }

  if (activeTruck) loadStops();
  startPoll();
}

function selectTruck(id) {
  activeTruck = id;
  localStorage.setItem('sw_truck', id);
  // Pull driver name from the truck record
  const truck = trucks.find(t => String(t.id) === String(id));
  if (truck && truck.driver) driverName = truck.driver;
  if (id) loadStops();
  else {
    document.getElementById('stops').innerHTML = '<div id="empty"><div class="icon">🚚</div><div>Select your truck to see today\'s stops</div></div>';
    document.getElementById('summary-bar').style.display = 'none';
  }
}

// ── LOAD STOPS ────────────────────────────────────────────────────────────────
async function loadStops() {
  if (!activeTruck) return;
  setSyncStatus('amber');
  try {
    await loadCityCoordsOnce();
    // Get stops for this truck on the selected date
    const r = await fetch(
      `${SB_URL}/rest/v1/truck_stops?truck_id=eq.${activeTruck}&delivery=eq.${activeDate}&order=seq,wo_num`,
      { headers: HDR }
    );
    const rawStops = await r.json();

    // Get WO details for each stop (to get line items)
    if (rawStops.length === 0) {
      document.getElementById('stops').innerHTML =
        '<div id="empty"><div class="icon">✅</div><div>No stops scheduled for today</div></div>';
      document.getElementById('summary-bar').style.display = 'none';
      setSyncStatus('green');
      return;
    }

    const woIds = [...new Set(rawStops.map(s => s.wo_id).filter(Boolean))].join(',');
    let wos = [], lis = [];
    if(woIds){
      const [woRes, liRes] = await Promise.all([
        fetch(`${SB_URL}/rest/v1/work_orders?id=in.(${woIds})`, { headers: HDR }),
        fetch(`${SB_URL}/rest/v1/line_items?wo_id=in.(${woIds})&order=id`, { headers: HDR })
      ]);
      wos = await woRes.json();
      lis  = await liRes.json();
    }

    // Merge everything
    const woMap = {};
    wos.forEach(w => woMap[w.id] = w);
    const liMap = {};
    lis.forEach(li => { if(!liMap[li.wo_id]) liMap[li.wo_id] = []; liMap[li.wo_id].push(li); });

    // Fetch customer records to fill in missing address/cityst on stops
    const custNames = [...new Set(rawStops.map(s => s.customer).filter(Boolean))];
    let custMap = {};
    if (custNames.length) {
      const custFilter = custNames.map(n => `name.eq.${encodeURIComponent(n)}`).join(',');
      try {
        const cr = await fetch(`${SB_URL}/rest/v1/customers?name=in.(${custNames.map(n=>`"${n}"`).join(',')})`, { headers: HDR });
        const custs = await cr.json();
        if (Array.isArray(custs)) custs.forEach(c => custMap[c.name] = c);
      } catch(e) { console.warn('customer lookup failed', e); }
    }

    // Separate, broader fetch for MAP coordinates. custMap above only
    // matches customer names EXACTLY equal to the stop's stored customer
    // field, which breaks for multi-location customers where the WO/stop
    // carries the root name (e.g. "Riley Sales, Inc.") but the actual
    // customer record is location-suffixed ("Riley Sales, Inc. — Broomall
    // PA"). Pull the whole table (just the columns the map needs) and
    // resolve with the same fuzzy-match + zone-narrowing rule the main
    // app's Truck Planner map uses, so a stop's pin uses the correct
    // location's lat/lon instead of silently finding nothing.
    let allCustomersForMap = [];
    try {
      const acr = await fetch(`${SB_URL}/rest/v1/customers?select=name,zone,lat,lon`, { headers: HDR });
      const acs = await acr.json();
      if (Array.isArray(acs)) allCustomersForMap = acs;
    } catch(e) { console.warn('customer coords lookup failed', e); }

    function custNamesMatch(sysName, qbName){
      if(!sysName || !qbName) return false;
      if(sysName.toLowerCase() === qbName.toLowerCase()) return true;
      const sysLow = sysName.toLowerCase();
      const qbLow  = qbName.toLowerCase();
      if(sysLow.startsWith(qbLow)) return true;
      if(qbLow.startsWith(sysLow)) return true;
      return false;
    }
    function findStopCoords(s, cityStr){
      if(s.customer){
        let cust = allCustomersForMap.find(c=>c.name===s.customer);
        if(!cust){
          const candidates = allCustomersForMap.filter(c=>custNamesMatch(c.name, s.customer));
          if(candidates.length>1 && s.zone){
            cust = candidates.find(c=>c.zone===s.zone) || candidates[0];
          } else {
            cust = candidates[0];
          }
        }
        if(cust && cust.lat!=null && cust.lon!=null) return [Number(cust.lat), Number(cust.lon)];
      }
      // No precise customer location on file — fall back to the shared
      // city-level table (same source index.html's Truck Planner map uses),
      // parsed from the resolved "City, State" string for this stop.
      if(cityStr && CITY_COORDS_MAP){
        const commaIdx = cityStr.indexOf(',');
        if(commaIdx!==-1){
          const city = cityStr.slice(0,commaIdx).trim();
          const stateMatch = cityStr.slice(commaIdx+1).trim().match(/^([A-Za-z]{2})\b/);
          if(city && stateMatch){
            const key = `${city}|${stateMatch[1].toUpperCase()}`;
            if(CITY_COORDS_MAP[key]) return CITY_COORDS_MAP[key];
          }
        }
      }
      return null;
    }

    stops = rawStops.map(s => {
      // For vendor pickup stops, skip WO/customer lookup
      if(s.type === 'pickup'){
        return {
          ...s,
          address: s.address || '',
          cityst: s.cityst || '',
          wo: {},
          items: [],
          coords: null
        };
      }
      const wo   = woMap[s.wo_id] || {};
      const cust = custMap[s.customer] || {};
      // If customer name contains a location variant (e.g. "APR Supply — Southampton")
      // extract the city from the name rather than falling back to a different location's address
      const nameVariantMatch = (s.customer||'').match(/—\s*([^—]+)$/);
      const variantCity = nameVariantMatch ? nameVariantMatch[1].trim() : '';
      // Build best city: stop → WO → customer record → name variant
      const city = s.cityst || wo.cityst || [cust.city, cust.state].filter(Boolean).join(', ') || variantCity;
      // Build best address: stop → customer record only if city matches, else blank
      // Never use WO address if it belongs to a different location
      const custCityMatch = cust.city && city && cust.city.toLowerCase() === city.split(',')[0].toLowerCase();
      const address = s.address || (custCityMatch ? cust.address : '') || '';
      return {
        ...s,
        address,
        cityst: city,
        wo,
        items: liMap[s.wo_id] || [],
        coords: findStopCoords(s, city)
      };
    });

    renderStops();
    if(scheduleView==='map') renderStopsMap();
    setSyncStatus('green');
  } catch(e) {
    setSyncStatus('red');
    showToast('⚠ Failed to load stops');
  }
}

function startPoll() {
  clearInterval(pollTimer);
  pollTimer = setInterval(() => { if(activeTruck && !document.hidden) loadStops(); }, 60000);
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && activeTruck) loadStops();
});

// ── RENDER ────────────────────────────────────────────────────────────────────
function setScheduleView(view){
  scheduleView = view;
  document.getElementById('view-list-btn').classList.toggle('active', view==='list');
  document.getElementById('view-map-btn').classList.toggle('active', view==='map');
  document.getElementById('stops').style.display = view==='list' ? '' : 'none';
  document.getElementById('stops-map-wrap').style.display = view==='map' ? '' : 'none';
  if(view==='map') renderStopsMap();
}

// Single map for the WHOLE day's route on this truck — numbered stops in
// the same seq order shown on the list, connected by a line from the shop.
// Coordinates come only from customers.lat/lon (see findStopCoords in
// loadStops) — this file deliberately does NOT carry its own copy of the
// giant city-lookup table from the main app; duplicating that hardcoded
// data across two files is exactly the kind of drift the main app already
// works hard to avoid. Coverage grows over time as customers get located
// via "📍 Locate address" / "🗺 Pick on map" in Customer Admin.
function renderStopsMap(){
  const container = document.getElementById('stops-map');
  const noteEl = document.getElementById('stops-map-note');
  if(!container || typeof L === 'undefined') return;

  if(_stopsMapInstance){ _stopsMapInstance.remove(); _stopsMapInstance = null; }

  const map = L.map(container).setView([BENSALEM_LAT, BENSALEM_LON], 9);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18, attribution: '© OpenStreetMap contributors'
  }).addTo(map);
  _stopsMapInstance = map;

  L.circleMarker([BENSALEM_LAT, BENSALEM_LON], {
    radius: 8, color: '#1a1a1a', fillColor: '#1a1a1a', fillOpacity: 1, weight: 2
  }).addTo(map).bindPopup('<strong>Sherwood Steel — Bensalem, PA</strong>');

  const bounds = [[BENSALEM_LAT, BENSALEM_LON]];
  const line = [];
  const missing = [];
  let stopNum = 0;

  stops.forEach(s => {
    stopNum++;
    if(s.type === 'pickup' || !s.coords){
      if(s.type !== 'pickup') missing.push(s.customer || 'Unknown stop');
      return;
    }
    const color = s.delivered ? '#2e8f5e' : '#2d6bb5';
    const icon = L.divIcon({
      className: '',
      html: `<div style="width:26px;height:26px;border-radius:50%;background:${color};color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)">${s.delivered ? '✓' : stopNum}</div>`,
      iconSize: [26,26], iconAnchor: [13,13]
    });
    const marker = L.marker(s.coords, { icon }).addTo(map);
    marker.bindPopup(
      `<strong>Stop ${stopNum} — ${s.customer||'Customer'}</strong><br>` +
      (s.address||s.cityst ? `${s.address||''}${s.address&&s.cityst?', ':''}${s.cityst||''}<br>` : '') +
      (s.delivered ? '✓ Delivered' : 'Pending')
    );
    line.push(s.coords);
    bounds.push(s.coords);
  });

  if(line.length>1){
    L.polyline([[BENSALEM_LAT,BENSALEM_LON], ...line], { color: '#2d6bb5', weight: 3, opacity: 0.6, dashArray: '6,6' }).addTo(map);
  }
  if(bounds.length>1) map.fitBounds(bounds, { padding:[30,30], maxZoom: 13 });

  if(missing.length){
    noteEl.style.display = '';
    noteEl.innerHTML = `⚠ ${missing.length} stop${missing.length===1?'':'s'} not shown — no location on file yet: ${missing.join(', ')}. Ask the office to add one via 📍 Locate address or 🗺 Pick on map in Customer Admin.`;
  } else {
    noteEl.style.display = 'none';
  }
}

function renderStops() {
  const container = document.getElementById('stops');
  const pending   = stops.filter(s => !s.delivered).length;
  const delivered = stops.filter(s => s.delivered).length;

  // Summary bar
  const sb = document.getElementById('summary-bar');
  sb.style.display = 'flex';
  const dateLabel = activeDate === new Date().toISOString().split('T')[0]
    ? 'today'
    : new Date(activeDate+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
  document.getElementById('summary-text').innerHTML =
    `<span class="sum-num">${stops.length}</span> stops ${dateLabel} &nbsp;·&nbsp; ` +
    `<span class="sum-num" style="color:var(--green)">${delivered}</span> delivered &nbsp;·&nbsp; ` +
    `<span class="sum-num" style="color:var(--amber)">${pending}</span> remaining`;

  if (!stops.length) {
    container.innerHTML = '<div id="empty"><div class="icon">✅</div><div>No stops for today</div></div>';
    return;
  }

  container.innerHTML = stops.map((stop, idx) => renderStopCard(stop, idx)).join('');

  // Restore open state
  if (openStopId) {
    const el = document.getElementById(`detail-${openStopId}`);
    if (el) el.classList.add('open');
  }
}

function renderStopCard(stop, idx) {
  // ── Vendor Pickup Stop ──
  if(stop.type === 'pickup'){
    const isPickedUp = !!stop.delivered;
    const statusClass = isPickedUp ? 'delivered' : '';
    const badgeText   = isPickedUp ? '✓ Picked Up' : 'Pending Pickup';
    const badgeStyle  = isPickedUp
      ? 'background:#4caf50;color:#fff;border-radius:12px;padding:3px 10px;font-size:11px;font-weight:700'
      : 'background:#e8a000;color:#fff;border-radius:12px;padding:3px 10px;font-size:11px;font-weight:700';
    const note = stop.pickup_note || stop.notes || '';
    const addr = [stop.address, stop.cityst].filter(Boolean).join(', ');
    const mapsUrl = addr ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addr)}` : '';

    const today = new Date().toISOString().split('T')[0];
    const isFuture = activeDate > today;
    let actionsHtml = '';
    if(!isFuture && !isPickedUp){
      actionsHtml = `<div class="stop-actions">
        <button class="btn-action" style="background:#e8a000;color:#fff" onclick="markVendorPickedUp('${stop.id}');event.stopPropagation()">🛻 Mark Picked Up</button>
      </div>`;
    } else if(isPickedUp){
      actionsHtml = `<div class="stop-actions">
        <button class="btn-action btn-undo" onclick="undoVendorPickedUp('${stop.id}');event.stopPropagation()">↩ Undo Picked Up</button>
      </div>`;
    }

    return `<div class="stop-card ${statusClass}" id="stop-${stop.id}" style="border-left:4px solid #e8a000;background:${isPickedUp?'#fff8e6':'#fffbf0'}">
      <div class="stop-header" onclick="toggleDetail('${stop.id}')">
        <div class="stop-num-badge" style="background:#e8a000;color:#fff">${idx + 1}</div>
        <div class="stop-info">
          <div style="font-size:10px;font-weight:800;color:#b37300;text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px;background:#fff3cd;padding:2px 6px;border-radius:3px;display:inline-block">🛻 VENDOR PICKUP</div>
          <div class="stop-customer">${stop.customer || 'Vendor'}</div>
          ${mapsUrl
            ? `<a href="${mapsUrl}" target="_blank" rel="noopener" class="stop-address-link"><span class="maps-icon">📍</span><span class="maps-text">${addr}</span><span class="maps-arrow">›</span></a>`
            : `<div class="stop-address">📍 ${stop.cityst || 'No address on file'}</div>`
          }
          ${note ? `<div class="stop-meta">${note}</div>` : ''}
        </div>
        <div class="stop-status-badge" style="${badgeStyle}">${badgeText}</div>
      </div>
      ${actionsHtml}
    </div>`;
  }

  const isDelivered = !!stop.delivered;
  const isArrived   = !!stop.arrived_at && !isDelivered;
  const statusClass = isDelivered ? 'delivered' : isArrived ? 'arrived' : '';
  const badgeClass  = isDelivered ? 'badge-delivered' : isArrived ? 'badge-arrived' : 'badge-pending';
  const badgeText   = isDelivered ? '✓ Delivered' : isArrived ? '📍 On Site' : 'Pending';
  const numClass    = isDelivered ? 'delivered' : isArrived ? 'arrived' : '';

  const wo = stop.wo || {};
  const rawAddress = stop.address || '';
  const rawCityst  = stop.cityst  || '';
  const address    = [rawAddress, rawCityst].filter(Boolean).join(', ');
  const mapsQuery  = encodeURIComponent(address);
  const mapsUrl    = mapsQuery ? `https://www.google.com/maps/search/?api=1&query=${mapsQuery}` : '';

  // Line items
  const itemRows = (stop.items || []).map(li => {
    const spec = [li.gauge ? li.gauge+' Ga' : '', li.size || li.product_cat || ''].filter(Boolean).join(' ');
    const statusCls = li.status === 'Complete' ? 'complete' : li.status === 'In Process' ? 'inprocess' : 'pending';
    const statusLabel = li.status === 'Complete' ? '✓ Done' : li.status === 'In Process' ? '▶ In Process' : '○ Pending';
    return `<div class="li-row">
      <div>
        <div class="li-spec">${spec || li.product_cat || '—'}</div>
        ${li.notes ? `<div class="li-notes">${li.notes}</div>` : ''}
      </div>
      <div class="li-qty">× ${li.qty || '—'}</div>
      <div class="li-status ${statusCls}">${statusLabel}</div>
    </div>`;
  }).join('');

  // Timestamps display
  let tsHtml = '';
  if (stop.arrived_at || stop.departed_at || stop.mileage) {
    tsHtml = `<div class="timestamps">`;
    if (stop.arrived_at)  tsHtml += `Arrived: <span>${fmtTime(stop.arrived_at)}</span> &nbsp;`;
    if (stop.departed_at) tsHtml += `Departed: <span>${fmtTime(stop.departed_at)}</span> &nbsp;`;
    if (stop.mileage)     tsHtml += `Odometer: <span>${stop.mileage.toLocaleString()} mi</span>`;
    tsHtml += `</div>`;
  }

  // Action buttons — only show for today or past, not future
  const today = new Date().toISOString().split('T')[0];
  const isFuture = activeDate > today;
  let actionsHtml = '';
  if (isFuture) {
    actionsHtml = ''; // future — view only
  } else if (!isDelivered) {
    if (!isArrived) {
      actionsHtml = `<div class="stop-actions">
        <button class="btn-action btn-arrive" onclick="markArrived('${stop.id}');event.stopPropagation()">📍 Arrived at Stop</button>
      </div>
      <div class="input-row">
        <label>Odometer</label>
        <input type="number" id="mileage-${stop.id}" placeholder="e.g. 48250" inputmode="numeric">
      </div>`;
    } else {
      actionsHtml = `<div class="stop-actions">
        <button class="btn-action btn-deliver active" onclick="markDelivered('${stop.id}');event.stopPropagation()">🚚 Mark Delivered</button>
        <button class="btn-action btn-undo" onclick="undoArrived('${stop.id}');event.stopPropagation()">↩ Undo Arrived</button>
      </div>`;
    }
  } else {
    actionsHtml = `<div class="stop-actions">
      <button class="btn-action btn-undo" onclick="undoDelivered('${stop.id}');event.stopPropagation()">↩ Undo Delivered</button>
    </div>`;
  }

  return `<div class="stop-card ${statusClass}" id="stop-${stop.id}">
    <div class="stop-header" onclick="toggleDetail('${stop.id}')">
      <div class="stop-num-badge ${numClass}">${idx + 1}</div>
      <div class="stop-info">
        <div class="stop-customer">${stop.customer || wo.customer || '—'}</div>
        ${mapsUrl
          ? `<a href="${mapsUrl}" target="_blank" rel="noopener" class="stop-address-link"><span class="maps-icon">📍</span><span class="maps-text">${address}</span><span class="maps-arrow">›</span></a>`
          : `<div class="stop-address">📍 ${rawCityst || 'No address on file'}</div>`
        }
        <div class="stop-meta">WO #${stop.wo_num || wo.wo_num || '—'}${stop.notes ? ' · ' + stop.notes : ''}</div>
      </div>
      <div class="stop-status-badge ${badgeClass}">${badgeText}</div>
    </div>
    <div class="stop-detail" id="detail-${stop.id}">
      ${itemRows || '<div style="color:var(--text3);font-size:13px;padding:4px 0">No line items</div>'}
    </div>
    ${tsHtml}
    ${actionsHtml}
  </div>`;
}

function toggleDetail(id) {
  const el = document.getElementById(`detail-${id}`);
  if (!el) return;
  const isOpen = el.classList.contains('open');
  // Close all
  document.querySelectorAll('.stop-detail.open').forEach(d => d.classList.remove('open'));
  if (!isOpen) { el.classList.add('open'); openStopId = id; }
  else openStopId = null;
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
async function markArrived(stopId) {
  const mileageEl = document.getElementById(`mileage-${stopId}`);
  const mileage = mileageEl ? parseInt(mileageEl.value) || null : null;
  const now = new Date().toISOString();
  try {
    await sbPatch(stopId, { arrived_at: now, mileage, driver_name: driverName });
    showToast('📍 Arrival recorded');
    loadStops();
  } catch(e) { 
    showToast('⚠ Failed: ' + e.message);
    console.error('markArrived error:', e);
  }
}

async function markDelivered(stopId) {
  const now = new Date().toISOString();
  try {
    // Update truck_stops
    await sbPatch(stopId, { delivered: true, delivered_at: now, departed_at: now, driver_name: driverName });
    // Also update work_orders so the main dashboard reflects delivery
    const stop = stops.find(s => String(s.id) === String(stopId));
    if (stop && stop.wo_id) {
      await fetch(`${SB_URL}/rest/v1/work_orders?id=eq.${stop.wo_id}`, {
        method: 'PATCH',
        headers: { ...HDR, Prefer: 'return=minimal' },
        body: JSON.stringify({ delivered: true, delivered_at: now, delivered_by: driverName })
      });
    }
    showToast('✅ Delivered!');
    loadStops();
  } catch(e) { 
    showToast('⚠ Failed: ' + e.message);
    console.error('markDelivered error:', e);
  }
}

async function undoArrived(stopId) {
  if (!confirm('Undo arrival?')) return;
  try {
    await sbPatch(stopId, { arrived_at: null, mileage: null });
    showToast('↩ Arrival removed');
    loadStops();
  } catch(e) { showToast('⚠ Failed to save'); }
}

async function undoDelivered(stopId) {
  if (!confirm('Mark this stop as not delivered?')) return;
  try {
    await sbPatch(stopId, { delivered: false, delivered_at: null, departed_at: null });
    // Also clear work_orders delivered status
    const stop = stops.find(s => String(s.id) === String(stopId));
    if (stop && stop.wo_id) {
      await fetch(`${SB_URL}/rest/v1/work_orders?id=eq.${stop.wo_id}`, {
        method: 'PATCH',
        headers: { ...HDR, Prefer: 'return=minimal' },
        body: JSON.stringify({ delivered: false, delivered_at: null, delivered_by: null })
      });
    }
    showToast('↩ Delivery undone');
    loadStops();
  } catch(e) { showToast('⚠ Failed to save'); }
}

async function markVendorPickedUp(stopId) {
  try {
    await sbPatch(stopId, { delivered: true, delivered_at: new Date().toISOString(), driver_name: driverName });
    showToast('🛻 Marked as picked up');
    loadStops();
  } catch(e) { showToast('⚠ Failed: ' + e.message); }
}

async function undoVendorPickedUp(stopId) {
  if (!confirm('Undo this pickup?')) return;
  try {
    await sbPatch(stopId, { delivered: false, delivered_at: null });
    showToast('↩ Pickup undone');
    loadStops();
  } catch(e) { showToast('⚠ Failed: ' + e.message); }
}

async function sbPatch(stopId, body) {
  const r = await fetch(`${SB_URL}/rest/v1/truck_stops?id=eq.${stopId}`, {
    method: 'PATCH',
    headers: { ...HDR, Prefer: 'return=minimal' },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error(await r.text());
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function setSyncStatus(color) {
  const dot = document.getElementById('sync-dot');
  dot.className = color;
}

function fmtTime(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 6000);
}

// ── DATE NAV ─────────────────────────────────────────────────────────────────
function selectDate(val) {
  activeDate = val;
  updateTodayBtn();
  if (activeTruck) loadStops();
}

function shiftDate(dir) {
  const d = new Date(activeDate + 'T12:00:00');
  d.setDate(d.getDate() + dir);
  activeDate = d.toISOString().split('T')[0];
  document.getElementById('date-picker').value = activeDate;
  updateTodayBtn();
  if (activeTruck) loadStops();
}

function goToday() {
  activeDate = new Date().toISOString().split('T')[0];
  document.getElementById('date-picker').value = activeDate;
  updateTodayBtn();
  if (activeTruck) loadStops();
}

function updateTodayBtn() {
  const today = new Date().toISOString().split('T')[0];
  const btn = document.getElementById('today-btn');
  const isToday = activeDate === today;
  btn.style.display = isToday ? 'none' : '';
  // Show friendly date label
  const d = new Date(activeDate + 'T12:00:00');
  const label = isToday ? 'Today' : d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
  document.getElementById('summary-bar') && (document.getElementById('summary-text').dataset.date = label);
}

// ── START ─────────────────────────────────────────────────────────────────────
init();
</script>
