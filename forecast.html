<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="apple-touch-icon" href="icon_forecast.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forecast">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sherwood Steel — Forecast & Dashboard</title>
<style>
:root{
  --forest:#1C2E1C;--forest-mid:#2D6A2D;--forest-light:#3D7A3D;
  --sage:#A8D5A8;--sage-dim:#7AB87A;
  --cream:#F0F4F0;--white:#FFFFFF;--steel-light:#C8D8D4;
  --rust:#C94F2A;--amber:#D4891A;--amber-light:#F5C842;
  --green-ok:#1E7E34;--text-primary:#1A2A1A;--text-secondary:#4A6A4A;
  --text-muted:#7A9A7A;--border:#D0DDD0;--border-dark:#A8C0A8;
  --row-alt:#F5FAF5;--row-hover:#EBF5EB;--shadow:rgba(28,46,28,0.12);
  --input-bg:rgba(168,213,168,0.13);--input-focus:rgba(168,213,168,0.28);
  --calc-col:#F8FBF8;--theo-col:#FFFBF0;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--cream);color:var(--text-primary);min-height:100vh;}

/* LOGIN */
#login-overlay{position:fixed;inset:0;z-index:99999;background:var(--forest);display:flex;align-items:center;justify-content:center;}
.login-card{background:var(--white);border-radius:12px;padding:40px;width:340px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,0.4);}
.login-card .brand{font-size:22px;font-weight:800;color:var(--forest);margin-bottom:4px;}
.login-card .sub{font-size:12px;color:var(--text-muted);margin-bottom:28px;letter-spacing:1px;text-transform:uppercase;}
.login-card input[type=password]{width:100%;padding:11px 14px;font-size:14px;border:2px solid var(--border-dark);border-radius:8px;margin-bottom:12px;outline:none;font-family:inherit;transition:border-color .15s;}
.login-card input:focus{border-color:var(--forest-mid);}
.login-card button{width:100%;padding:12px;font-size:14px;font-weight:700;background:var(--forest-mid);color:var(--white);border:none;border-radius:8px;cursor:pointer;}
.login-card button:hover{background:var(--forest-light);}
.login-error{color:var(--rust);font-size:12px;margin-top:10px;display:none;}

/* HEADER */
.app-header{background:var(--forest);color:var(--white);padding:0 20px;display:flex;align-items:center;gap:14px;height:56px;box-shadow:0 2px 8px var(--shadow);position:sticky;top:0;z-index:100;}
.logo{font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--sage);}
.page-title{font-size:15px;font-weight:600;opacity:.9;}
.hdiv{width:1px;height:24px;background:rgba(168,213,168,.3);}
.hspace{flex:1;}
.sync-badge{font-size:11px;padding:3px 8px;border-radius:4px;font-weight:600;}
.sync-ok{background:rgba(168,213,168,.2);color:var(--sage);}
.sync-loading{background:rgba(212,137,26,.2);color:var(--amber-light);}
.sync-err{background:rgba(201,79,42,.2);color:#ff8a7a;}

/* WEIGHT TOGGLE */
.weight-toggle{display:flex;align-items:center;gap:0;border:1px solid var(--border-dark);border-radius:6px;overflow:hidden;}
.wt-btn{padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;border:none;background:rgba(255,255,255,.1);color:rgba(168,213,168,.7);transition:all .15s;white-space:nowrap;}
.wt-btn.active{background:var(--sage);color:var(--forest);}
.wt-btn:hover:not(.active){background:rgba(168,213,168,.2);color:var(--sage);}

.btn-sm{padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border-dark);background:var(--white);color:var(--text-secondary);}
.btn-sm:hover{background:var(--row-hover);}

/* TABS */
.tab-bar{background:var(--forest);border-bottom:2px solid var(--forest-mid);display:flex;padding:0 20px;gap:2px;overflow-x:auto;}
.tab-btn{background:none;border:none;color:rgba(168,213,168,.6);padding:10px 20px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:color .15s,border-color .15s;}
.tab-btn:hover{color:var(--sage);}
.tab-btn.active{color:var(--sage);border-bottom-color:var(--sage);}

/* SAVE BAR */
.save-bar{display:none;align-items:center;gap:12px;background:var(--amber);color:var(--white);padding:8px 16px;font-size:13px;font-weight:600;}
.save-bar.visible{display:flex;}
.save-bar .sba{margin-left:auto;display:flex;gap:8px;}
.save-bar button{padding:5px 12px;border-radius:5px;font-size:12px;font-weight:700;cursor:pointer;border:none;}
.sb-save{background:var(--white);color:var(--amber);}
.sb-disc{background:rgba(255,255,255,.2);color:var(--white);}

/* MAIN */
.main{padding:16px 20px 40px;max-width:1900px;margin:0 auto;}

/* KPI CARDS */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:18px;}
.kpi{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:14px 16px;box-shadow:0 1px 3px var(--shadow);}
.kpi.accent{background:var(--forest);border-color:var(--forest-mid);}
.kpi .kl{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-muted);margin-bottom:5px;}
.kpi.accent .kl{color:var(--sage-dim);}
.kpi .kv{font-size:24px;font-weight:800;color:var(--forest);line-height:1;}
.kpi.accent .kv{color:var(--sage);}
.kpi .ks{font-size:11px;color:var(--text-secondary);margin-top:3px;}
.kpi.accent .ks{color:rgba(168,213,168,.7);}
.kpi.warn .kv{color:var(--rust);}
.kpi.good .kv{color:var(--green-ok);}

/* THEO BANNER */
.theo-banner{background:var(--theo-col);border:1px solid #e8c840;border-radius:8px;padding:8px 14px;margin-bottom:14px;font-size:12px;color:#7a6010;display:none;align-items:center;gap:8px;}
.theo-banner.visible{display:flex;}

/* TARGET CONTROL */
.controls-row{display:flex;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap;}
.target-ctrl{display:flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--border);border-radius:8px;padding:10px 14px;box-shadow:0 1px 3px var(--shadow);}
.target-ctrl label{font-size:13px;font-weight:700;color:var(--forest);}
.target-ctrl input{width:55px;padding:5px 8px;font-size:15px;font-weight:700;border:2px solid var(--border-dark);border-radius:6px;text-align:center;outline:none;font-family:inherit;color:var(--forest);}
.target-ctrl input:focus{border-color:var(--forest-mid);}
.target-ctrl span{font-size:12px;color:var(--text-muted);}

/* DASHBOARD TABLE */
.dtable-wrap{background:var(--white);border:1px solid var(--border);border-radius:8px;overflow:hidden;box-shadow:0 1px 4px var(--shadow);}
.dtable-wrap table{width:100%;border-collapse:collapse;font-size:13px;}
.dtable-wrap thead th{background:var(--forest);color:var(--sage);padding:9px 11px;text-align:left;font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;white-space:nowrap;}
.dtable-wrap thead th.r{text-align:right;}
.dtable-wrap thead th.theo-hdr{background:#4a3a00;color:#f5c842;}
.dtable-wrap tbody tr{border-bottom:1px solid var(--border);transition:background .1s;}
.dtable-wrap tbody tr:nth-child(even){background:var(--row-alt);}
.dtable-wrap tbody tr:hover{background:var(--row-hover);}
.dtable-wrap tbody td{padding:8px 11px;white-space:nowrap;}
.dtable-wrap tbody td.r{text-align:right;font-variant-numeric:tabular-nums;}
.dtable-wrap tfoot tr{background:#E8F0E8;border-top:2px solid var(--border-dark);}
.dtable-wrap tfoot td{padding:9px 11px;font-weight:700;font-size:13px;}
.dtable-wrap tfoot td.r{text-align:right;}
.theo-cell{background:var(--theo-col);color:#7a6010;font-style:italic;}

/* STATUS */
.sbadge{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;}
.s-over{background:#D4EDDA;color:#155724;}
.s-near{background:#FFF3CD;color:#856404;}
.s-below{background:#F8D7DA;color:#721C24;}
.s-none{background:#eee;color:#888;}
.gauge-chip{display:inline-block;background:var(--steel-light);color:var(--forest);font-size:11px;font-weight:700;padding:2px 6px;border-radius:3px;}

/* MONTHS BAR */
.mbar-wrap{display:flex;align-items:center;gap:6px;}
.mbar-bg{width:70px;height:9px;background:#e0e0e0;border-radius:5px;overflow:hidden;flex-shrink:0;}
.mbar-fill{height:100%;border-radius:5px;transition:width .3s;}
.bar-over{background:var(--green-ok);}
.bar-near{background:var(--amber);}
.bar-below{background:var(--rust);}

/* FORECAST TABLE */
.gauge-header{background:var(--forest);color:var(--sage);padding:7px 14px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-top:12px;border-radius:6px 6px 0 0;}
.fgroup{background:var(--white);border:1px solid var(--border);border-top:none;border-radius:0 0 6px 6px;overflow:hidden;margin-bottom:4px;}
.fgroup table{width:100%;border-collapse:collapse;font-size:12.5px;}
.fgroup thead th{background:var(--forest-mid);color:var(--sage);padding:7px 9px;text-align:left;font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;white-space:nowrap;}
.fgroup thead th.r{text-align:right;}
.fgroup thead th.inp-hdr{background:#1a4a1a;color:#c8f0c8;}
.fgroup thead th.calc-hdr{background:#233023;color:#8dc08d;}
.fgroup thead th.theo-hdr{background:#3a2e00;color:#f0c030;}
.fgroup tbody tr{border-bottom:1px solid var(--border);}
.fgroup tbody tr:hover{background:var(--row-hover);}
.fgroup tbody tr.total-row{background:#E8F0E8;font-weight:700;border-top:2px solid var(--border-dark);}
.fgroup tbody td{padding:6px 9px;white-space:nowrap;}
.fgroup tbody td.r{text-align:right;font-variant-numeric:tabular-nums;}
.fgroup tbody td.calc-cell{background:var(--calc-col);color:var(--text-secondary);}
.fgroup tbody td.theo-cell{background:var(--theo-col);color:#7a6010;font-style:italic;}

/* EDITABLE INPUTS */
.einput{background:var(--input-bg);border:1px solid transparent;border-radius:4px;padding:4px 7px;width:80px;text-align:right;font-size:12.5px;font-family:inherit;color:var(--forest);outline:none;font-variant-numeric:tabular-nums;transition:all .15s;}
.einput:focus{background:var(--input-focus);border-color:var(--forest-mid);box-shadow:0 0 0 2px rgba(45,106,45,.15);}
.einput.zero{color:var(--text-muted);}
.einput:focus.zero{color:var(--forest);}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--forest);color:var(--white);padding:12px 18px;border-radius:8px;font-size:13px;font-weight:600;box-shadow:0 4px 16px var(--shadow);z-index:9999;transform:translateY(80px);opacity:0;transition:all .25s ease;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.success{background:var(--forest-mid);}
.toast.error{background:var(--rust);}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-overlay">
  <div class="login-card">
    <div class="brand">Sherwood Steel</div>
    <div class="sub">Forecast &amp; Dashboard</div>
    <input type="password" id="login-pw" placeholder="Enter shop password"
      onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Sign In</button>
    <div class="login-error" id="login-error">Incorrect password. Try again.</div>
  </div>
</div>

<header class="app-header" id="app-header" style="display:none">
  <span class="logo">Sherwood Steel</span>
  <div class="hdiv"></div>
  <span class="page-title">Forecast &amp; Dashboard</span>
  <div class="hspace"></div>
  <span class="sync-badge sync-ok" id="sync-badge" style="display:none">✓ Synced</span>
  <div class="weight-toggle" title="Switch between actual and theoretical sheet weights">
    <button class="wt-btn active" id="wt-actual" onclick="setWeightMode('actual')">Actual Wt</button>
    <button class="wt-btn" id="wt-theo" onclick="setWeightMode('theoretical')">Theoretical</button>
  </div>
  <button class="btn-sm" onclick="logout()">↩ Out</button>
</header>

<nav class="tab-bar" id="tab-bar" style="display:none">
  <button class="tab-btn active" id="tab-dashboard" onclick="switchTab('dashboard')">Dashboard</button>
  <button class="tab-btn" id="tab-forecast" onclick="switchTab('forecast')">Forecast Detail</button>
</nav>

<div class="save-bar" id="save-bar">
  <span id="save-msg">Unsaved changes</span>
  <div class="sba">
    <button class="sb-disc" onclick="discardChanges()">Discard</button>
    <button class="sb-save" onclick="saveChanges()">Save to Supabase</button>
  </div>
</div>

<!-- Excel Import -->
<div id="import-bar" style="background:var(--forest-mid);padding:8px 20px;display:flex;align-items:center;gap:12px;font-size:13px;color:rgba(255,255,255,0.85)">
  <span style="font-weight:700;color:var(--sage)">📥 Import from Excel</span>
  <span style="opacity:0.7">Upload Forecast Excel to sync manual entries (C, D, J, K)</span>
  <label style="margin-left:auto;background:var(--sage);color:var(--forest);font-weight:700;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px">
    Choose File
    <input type="file" accept=".xlsx,.xls" style="display:none" onchange="importFromExcel(this)">
  </label>
  <span id="import-status" style="font-size:12px;opacity:0.8"></span>
</div>

<main class="main" id="app-main" style="display:none">
  <div id="pane-dashboard"></div>
  <div id="pane-forecast" style="display:none"></div>
</main>

<div class="toast" id="toast"></div>

// ── AUTH ──
function isLoggedIn(){return localStorage.getItem(SESSION_KEY)==='authenticated';}
async function doLogin(){
  const pw=(document.getElementById('login-pw').value||'').trim();
  if(!pw)return;
  try{
    const r=await fetch(`${SB_URL}/rest/v1/admin_config?key=eq.shop_password&select=value`,{headers:SB_HDR});
    const cfg=await r.json();
    const stored=cfg&&cfg[0]?cfg[0].value:'sherwood';
    const correct=typeof stored==='string'?stored:JSON.stringify(stored).replace(/^"|"$/g,'');
    if(pw===correct){
      localStorage.setItem(SESSION_KEY,'authenticated');
      document.getElementById('login-overlay').remove();
      showApp();
    }else{
      document.getElementById('login-error').style.display='block';
      document.getElementById('login-pw').value='';
    }
  }catch(e){
    if(pw==='sherwood'){localStorage.setItem(SESSION_KEY,'authenticated');document.getElementById('login-overlay').remove();showApp();}
    else{document.getElementById('login-error').textContent='Cannot reach server.';document.getElementById('login-error').style.display='block';}
  }
}
function logout(){localStorage.removeItem(SESSION_KEY);location.reload();}
function showApp(){
  ['app-header','tab-bar','app-main'].forEach(id=>document.getElementById(id).style.display='');
  init();
}

// ── SUPABASE ──
async function sbGet(table,params=''){
  try{const r=await fetch(`${SB_URL}/rest/v1/${table}${params?'?'+params:''}`,{headers:SB_HDR});if(!r.ok)return null;return await r.json();}
  catch(e){return null;}
}
async function sbUpsert(table,body){
  try{const r=await fetch(`${SB_URL}/rest/v1/${table}`,{method:'POST',headers:{...SB_HDR,'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(body)});return r.ok;}
  catch(e){return false;}
}

// ── LIVE INVENTORY PULL ──
async function refreshFromInventory(){
  // Single fetch — inventory_sheets has everything we need:
  //   Sheet rows  (size like "48 x 96"): price>0 -> Col E (pcs count)
  //   Coil rows   (size = numeric width like "48"): price>0 -> Col F (lbs in stock)
  //   Coil rows   (size = numeric width): price=0  -> Col H (MJS lbs)
  const invRows=await sbGet('inventory_sheets','select=data');
  if(!invRows||!invRows.length) return;

  const inv=invRows.map(r=>r.data).filter(d=>d&&d.gauge&&d.size);

  // Helper: apply not/has filter on bundle tag
  function passesFilter(bundle,rule){
    if(rule.not&&rule.not.some(ex=>bundle.includes(ex))) return false;
    if(rule.has&&rule.has.length>0&&!rule.has.some(inc=>bundle.includes(inc))) return false;
    return true;
  }

  // ── Col E: sheet piece counts (price > 0) ──
  const eLookup={};
  Object.entries(FILTER_RULES).forEach(([fkey,rule])=>{
    let total=0;
    inv.forEach(d=>{
      if(parseInt(d.gauge)!==rule.gauge) return;
      if(String(d.size||'').trim()!==rule.size) return;
      if((parseFloat(d.price)||0)===0) return;
      if(!passesFilter(String(d.bundle||'').trim(),rule)) return;
      total+=parseInt(d.pcs)||0;
    });
    eLookup[fkey]=total;
  });

  // ── Col F (coil lbs, price>0) and Col H (MJS lbs, price=0) ──
  const fLookup={};
  const hLookup={};
  Object.entries(COIL_FILTER_RULES).forEach(([cfkey,rule])=>{
    let fTotal=0, hTotal=0;
    inv.forEach(d=>{
      if(parseInt(d.gauge)!==rule.gauge) return;
      if(String(d.size||'').trim()!==rule.width) return;
      if(!passesFilter(String(d.bundle||'').trim(),rule)) return;
      const pcs=parseInt(d.pcs)||0;
      const price=parseFloat(d.price)||0;
      if(price===0){
        hTotal+=pcs; // price=0 -> MJS consignment (G=0 in Excel) -> Col H
      } else {
        fTotal+=pcs; // price>0 (G<>0 in Excel) -> owned stock -> Col F
      }
    });
    fLookup[cfkey]=fTotal;
    hLookup[cfkey]=hTotal;
  });

  // ── Apply to groups ──
  groups.forEach(g=>{
    g.rows.forEach(row=>{
      if(!row.is_coil&&row.fkey){
        // Sheet row -> update Col E
        const v=eLookup[row.fkey];
        if(v!=null) row.E=v;
      } else if(row.is_coil&&row.cfkey){
        // Coil row -> update Col F and Col H from live inventory
        const f=fLookup[row.cfkey];
        const h=hLookup[row.cfkey];
        if(f!=null) row.F=f;
        if(h!=null) row.H=h;
      }
    });
  });
}

// ── WEIGHT LOOKUP ──
function getWeight(wkey){
  return WEIGHTS[weightMode]?.[wkey]||0;
}

// ── FORMULAS ──
function computeGroup(g){
  let D_total=0,F_total=0,H_total=0,J_total=0,K_total=0;
  g.rows.forEach(row=>{
    if(row.is_coil){
      row._D=parseFloat(row.D)||0;
      row._F=parseFloat(row.F)||0;
    }else{
      const w=getWeight(row.wkey);
      const calcD=(parseFloat(row.C)||0)*w;
      // If C=0 and a manual D is set, use manual D (allows direct lbs/mo entry)
      row._D=calcD>0?calcD:(parseFloat(row.D)||0);
      row._F=(parseFloat(row.E)||0)*w;
      row._W=w; // store weight used for display
    }
    D_total+=row._D;
    F_total+=row._F;
    H_total+=parseFloat(row.H)||0;
    J_total+=parseFloat(row.J)||0;
    K_total+=parseFloat(row.K)||0;
  });
  const I_months = D_total>0?(F_total+H_total)/D_total:0;
  const L_months = D_total>0?(F_total+H_total+J_total+K_total)/D_total:0;
  const N_target = targetMonths*D_total;
  const O_net    = N_target-(F_total+H_total+J_total+K_total);
  return{D_total,F_total,H_total,J_total,K_total,I_months,L_months,N_target,O_net};
}

// ── FORMAT ──
function fN(n,d=0){if(n==null)return'—';const v=parseFloat(n);if(isNaN(v))return'—';return v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});}
function fM(n){if(!n&&n!==0)return'—';const v=parseFloat(n);if(isNaN(v)||!isFinite(v))return'—';return v.toFixed(2);}
function fSign(n){const v=parseFloat(n)||0;return(v>=0?'+':'')+fN(v);}
function statLabel(mo,tgt){if(!mo&&mo!==0)return'none';if(mo>=tgt)return'over';if(mo>=tgt-1)return'near';return'below';}

  const tgt=targetMonths;

  const totalOver=computed.reduce((s,g)=>s+Math.min(0,g.O_net),0); // raw negative sum, matches Excel SUMIF(<0)
  // Excel: COUNTIF < target and > target (no "near" band)
  const below=computed.filter(g=>g.D_total>0&&(g.L_months||0)<tgt).length;
  const over=computed.filter(g=>g.D_total>0&&(g.L_months||0)>tgt).length;
  // Excel splits avg: rows 1-29 (sheets) vs rows 30-33 (5.394 coils)
  const sheetGroups=computed.filter(g=>g.id<=29);
  const coilGroups=computed.filter(g=>g.id>=30);
  // Excel AVERAGE skips blank cells (groups with D=0 have blank L_months in Excel)
  const sheetGroupsActive=sheetGroups.filter(g=>g.D_total>0);
  const coilGroupsActive=coilGroups.filter(g=>g.D_total>0);
  const avgMoSheets=sheetGroupsActive.length?sheetGroupsActive.reduce((s,g)=>s+(g.L_months||0),0)/sheetGroupsActive.length:0;
  const avgMoCoils=coilGroupsActive.length?coilGroupsActive.reduce((s,g)=>s+(g.L_months||0),0)/coilGroupsActive.length:0;

// ── INPUT HELPER ──
function inp(gid,rowR,field,val){
  const v=parseFloat(val)||0;
  return `<input class="einput${v===0?' zero':''}" type="number" min="0"
    value="${v}"
    oninput="updateField(${gid},${rowR},'${field}',this.value)"
    onkeydown="if(event.key==='Enter'){commitField(${gid},${rowR},'${field}',this.value);this.blur();}"
    onfocus="this.select();this.classList.remove('zero')"
    onblur="commitField(${gid},${rowR},'${field}',this.value);if(!parseFloat(this.value))this.classList.add('zero')"
    title="Enter ${field} value">`;
}

function updateField(gid,rowR,field,val){
  // Updates data model on every keystroke but does NOT re-render or mark dirty
  // so the input keeps focus and the user can type freely
  const g=groups.find(x=>x.id===gid);
  if(!g)return;
  const row=g.rows.find(r=>r.r===rowR);
  if(!row)return;
  row[field]=parseFloat(val)||0;
}

function commitField(gid,rowR,field,val){
  // Called on blur/enter — updates model then re-renders totals
  const g=groups.find(x=>x.id===gid);
  if(!g)return;
  const row=g.rows.find(r=>r.r===rowR);
  if(!row)return;
  row[field]=parseFloat(val)||0;
  markDirty();
  renderTab();
}

// ── DIRTY / SAVE ──
function markDirty(){
  dirty=true;
  document.getElementById('save-bar').classList.add('visible');
}
async function saveChanges(silent=false){
  setSyncBadge('loading');
  // Truncate via RPC then upsert fresh — ensures clean replace every time
  const payload=groups.map(g=>({group_id:g.id,target_months:targetMonths,data:g}));
  try{ await fetch(`${SB_URL}/rest/v1/rpc/truncate_forecast_groups`,{method:'POST',headers:SB_HDR,body:'{}'}); }catch(e){}
  const ok=await sbUpsert(SB_TABLE,payload);
  if(ok){
    setSyncBadge('ok');
    dirty=false;
    document.getElementById('save-bar').classList.remove('visible');
    if(!silent) showToast('Saved to Supabase','success');
  }else{
    setSyncBadge('err');
    showToast('Save failed — check connection','error');
  }
}
async function discardChanges(){
  dirty=false;
  document.getElementById('save-bar').classList.remove('visible');
  await init();
}

function importFromExcel(input){
  const file=input.files[0];
  if(!file) return;
  const status=document.getElementById('import-status');
  status.textContent='Reading…';
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'array',cellFormula:false});
      const ws=wb.Sheets['Forecast.'];
      if(!ws){status.textContent='⚠ Sheet "Forecast." not found';return;}
      const cv=(col,row)=>{
        const cell=ws[col+row];
        if(!cell) return 0;
        const v=parseFloat(cell.v);
        return isNaN(v)?0:v;
      };
      // Target months
      const newTarget=cv('M',2);
      if(newTarget>0) targetMonths=newTarget;
      // Update groups
      let updated=0;
      groups.forEach(g=>{
        const map=EXCEL_MAP[g.id];
        if(!map) return;
        const sheetRows=g.rows.filter(r=>!r.is_coil);
        map.C.forEach((excelRow,idx)=>{
          if(sheetRows[idx]) sheetRows[idx].C=cv('C',excelRow);
        });
        const coilRow=g.rows.find(r=>r.is_coil);
        if(coilRow){
          if(map.D!=null) coilRow.D=cv('D',map.D);
          if(map.J!=null) coilRow.J=cv('J',map.J);
          if(map.K!=null) coilRow.K=cv('K',map.K);
        }
        updated++;
      });
      markDirty();
      renderAll();
      status.textContent=`✓ Imported ${updated} groups — review then Save to Supabase`;
      input.value='';
    }catch(err){
      status.textContent='⚠ Error: '+err.message;
      console.error('Excel import error:',err);
    }
  };
  reader.readAsArrayBuffer(file);
}
