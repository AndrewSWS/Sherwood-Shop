<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sherwood Steel — Inventory</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --forest: #1C2E1C;
    --forest-mid: #2D6A2D;
    --forest-light: #3D7A3D;
    --sage: #A8D5A8;
    --sage-dim: #7AB87A;
    --cream: #F0F4F0;
    --white: #FFFFFF;
    --steel: #8FA8A0;
    --steel-light: #C8D8D4;
    --rust: #C94F2A;
    --amber: #D4891A;
    --text-primary: #1A2A1A;
    --text-secondary: #4A6A4A;
    --text-muted: #7A9A7A;
    --border: #D0DDD0;
    --border-dark: #A8C0A8;
    --row-alt: #F5FAF5;
    --row-hover: #EBF5EB;
    --shadow: rgba(28,46,28,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--cream);
    color: var(--text-primary);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  .app-header {
    background: var(--forest);
    color: var(--white);
    padding: 0 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    height: 56px;
    box-shadow: 0 2px 8px var(--shadow);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .app-header .logo {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--sage);
    white-space: nowrap;
  }

  .app-header .page-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--white);
    opacity: 0.9;
  }

  .header-divider {
    width: 1px;
    height: 24px;
    background: rgba(168,213,168,0.3);
  }

  .header-spacer { flex: 1; }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .btn-import {
    display: flex;
    align-items: center;
    gap: 7px;
    background: var(--forest-mid);
    color: var(--white);
    border: 1px solid var(--forest-light);
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .btn-import:hover { background: var(--forest-light); }
  .btn-import svg { flex-shrink: 0; }

  .last-updated {
    font-size: 11px;
    color: var(--sage-dim);
    opacity: 0.8;
  }

  /* ── TAB NAV ── */
  .tab-bar {
    background: var(--forest);
    border-bottom: 2px solid var(--forest-mid);
    display: flex;
    padding: 0 24px;
    gap: 2px;
    overflow-x: auto;
  }

  .tab-btn {
    background: none;
    border: none;
    color: rgba(168,213,168,0.65);
    padding: 10px 18px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    white-space: nowrap;
    transition: color 0.15s, border-color 0.15s;
    letter-spacing: 0.3px;
  }
  .tab-btn:hover { color: var(--sage); }
  .tab-btn.active {
    color: var(--sage);
    border-bottom-color: var(--sage);
  }

  .tab-badge {
    display: inline-block;
    background: rgba(168,213,168,0.18);
    color: var(--sage-dim);
    font-size: 10px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 10px;
    margin-left: 5px;
    vertical-align: middle;
  }
  .tab-btn.active .tab-badge {
    background: rgba(168,213,168,0.3);
    color: var(--sage);
  }

  /* ── MAIN CONTENT ── */
  .main {
    padding: 20px 24px 40px;
    max-width: 1600px;
    margin: 0 auto;
  }

  /* ── SUMMARY CARDS ── */
  .summary-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }

  .summary-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    box-shadow: 0 1px 3px var(--shadow);
  }

  .summary-card .card-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 5px;
  }

  .summary-card .card-value {
    font-size: 22px;
    font-weight: 700;
    color: var(--forest);
    line-height: 1;
  }

  .summary-card .card-sub {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 4px;
  }

  .summary-card.accent {
    background: var(--forest);
    border-color: var(--forest-mid);
  }
  .summary-card.accent .card-label { color: var(--sage-dim); }
  .summary-card.accent .card-value { color: var(--sage); }
  .summary-card.accent .card-sub { color: rgba(168,213,168,0.7); }

  /* ── TOOLBAR ── */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
    max-width: 380px;
  }

  .search-wrap svg {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
  }

  .search-input {
    width: 100%;
    padding: 8px 10px 8px 34px;
    border: 1px solid var(--border-dark);
    border-radius: 6px;
    font-size: 13px;
    background: var(--white);
    color: var(--text-primary);
    outline: none;
    transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--forest-mid); }

  .filter-select {
    padding: 8px 10px;
    border: 1px solid var(--border-dark);
    border-radius: 6px;
    font-size: 13px;
    background: var(--white);
    color: var(--text-primary);
    outline: none;
    cursor: pointer;
  }
  .filter-select:focus { border-color: var(--forest-mid); }

  .toolbar-right { margin-left: auto; display: flex; gap: 8px; }

  .btn-sm {
    padding: 7px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--border-dark);
    background: var(--white);
    color: var(--text-secondary);
    transition: all 0.15s;
  }
  .btn-sm:hover { background: var(--row-hover); border-color: var(--forest-mid); color: var(--forest); }
  .btn-sm.primary { background: var(--forest-mid); color: var(--white); border-color: var(--forest-mid); }
  .btn-sm.primary:hover { background: var(--forest-light); }

  /* ── TABLE ── */
  .table-wrap {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 1px 4px var(--shadow);
  }

  .table-container {
    overflow-x: auto;
    max-height: calc(100vh - 320px);
    overflow-y: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  thead {
    position: sticky;
    top: 0;
    z-index: 10;
  }

  thead th {
    background: var(--forest);
    color: var(--sage);
    padding: 10px 12px;
    text-align: left;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
    border-right: 1px solid rgba(168,213,168,0.1);
  }
  thead th:last-child { border-right: none; }
  thead th:hover { background: var(--forest-mid); }
  thead th.sorted-asc::after { content: ' ▲'; font-size: 9px; }
  thead th.sorted-desc::after { content: ' ▼'; font-size: 9px; }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: var(--row-hover); }
  tbody tr.section-header { background: #E8F0E8; }
  tbody tr.section-header td {
    font-weight: 700;
    color: var(--forest);
    font-size: 12px;
    letter-spacing: 0.5px;
    padding: 8px 12px 6px;
    border-bottom: 2px solid var(--border-dark);
  }

  tbody td {
    padding: 9px 12px;
    color: var(--text-primary);
    white-space: nowrap;
  }

  .td-num { text-align: right; font-variant-numeric: tabular-nums; }
  .td-money { text-align: right; font-variant-numeric: tabular-nums; color: var(--forest); font-weight: 600; }
  .td-total { text-align: right; font-variant-numeric: tabular-nums; color: var(--forest-mid); font-weight: 700; }

  .vendor-badge {
    display: inline-block;
    background: var(--forest);
    color: var(--sage);
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 3px;
    letter-spacing: 0.5px;
  }

  .gauge-chip {
    display: inline-block;
    background: var(--steel-light);
    color: var(--forest);
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 3px;
  }

  /* edit mode */
  .editable { cursor: text; }
  .editable:hover { background: rgba(168,213,168,0.2); border-radius: 3px; }
  .editing-input {
    width: 70px;
    padding: 2px 6px;
    border: 1px solid var(--forest-mid);
    border-radius: 3px;
    font-size: 13px;
    font-family: inherit;
    background: var(--white);
    text-align: right;
  }

  .row-modified td { background: rgba(212,137,26,0.08) !important; }
  .row-modified:hover td { background: rgba(212,137,26,0.14) !important; }

  /* table footer */
  .table-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    background: var(--row-alt);
    font-size: 12px;
    color: var(--text-secondary);
  }

  .table-footer strong { color: var(--forest); }

  /* ── EMPTY STATE ── */
  .empty-state {
    padding: 60px 20px;
    text-align: center;
    color: var(--text-muted);
  }
  .empty-state svg { margin-bottom: 12px; opacity: 0.4; }
  .empty-state p { font-size: 14px; }

  /* ── MODAL / TOAST ── */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--forest);
    color: var(--white);
    padding: 12px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    box-shadow: 0 4px 16px var(--shadow);
    z-index: 999;
    transform: translateY(80px);
    opacity: 0;
    transition: all 0.25s ease;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.error { background: var(--rust); }
  .toast.success { background: var(--forest-mid); }

  /* ── HIDDEN FILE INPUT ── */
  #file-input { display: none; }

  /* ── SAVE CHANGES BAR ── */
  .save-bar {
    display: none;
    align-items: center;
    gap: 12px;
    background: var(--amber);
    color: var(--white);
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
  }
  .save-bar.visible { display: flex; }
  .save-bar .save-actions { margin-left: auto; display: flex; gap: 8px; }
  .save-bar button {
    padding: 5px 12px;
    border-radius: 5px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    border: none;
  }
  .save-bar .btn-save { background: var(--white); color: var(--amber); }
  .save-bar .btn-discard { background: rgba(255,255,255,0.2); color: var(--white); }

  /* Responsive */
  @media (max-width: 768px) {
    .main { padding: 12px; }
    .summary-row { grid-template-columns: repeat(2, 1fr); }
    .app-header .last-updated { display: none; }
  }
</style>
</head>

<input type="file" id="file-input" accept=".xlsx,.xls">

</nav>

<div class="save-bar" id="save-bar">

  <div class="save-actions">
    <button class="btn-discard" onclick="discardChanges()">Discard</button>
    <button class="btn-save" onclick="saveChanges()">Save Changes</button>
  </div>
</div>

<main class="main">

</main>

// ── SEARCH/FILTER HELPERS ──
function getSearch(tabId) { return (state.search[tabId] || '').toLowerCase(); }
function setSearch(tabId, val) { state.search[tabId] = val; renderTab(tabId); }
function getFilter(tabId, field) { return state.filters[tabId]?.[field] || ''; }
function setFilter(tabId, field, val) {
  if (!state.filters[tabId]) state.filters[tabId] = {};
  state.filters[tabId][field] = val;
  renderTab(tabId);
}

// ── SORT HELPERS ──
function sortData(arr, col, dir) {
  return [...arr].sort((a, b) => {
    let av = a[col], bv = b[col];
    if (av === null || av === undefined) av = '';
    if (bv === null || bv === undefined) bv = '';
    if (typeof av === 'number' && typeof bv === 'number') return dir === 'asc' ? av - bv : bv - av;
    return dir === 'asc' ? String(av).localeCompare(String(bv)) : String(bv).localeCompare(String(av));
  });
}

function toggleSort(tabId, col) {
  if (!state.sortState[tabId]) state.sortState[tabId] = {};
  const cur = state.sortState[tabId];
  if (cur.col === col) {
    cur.dir = cur.dir === 'asc' ? 'desc' : 'asc';
  } else {
    cur.col = col;
    cur.dir = 'asc';
  }
  renderTab(tabId);
}

function sortClass(tabId, col) {
  const s = state.sortState[tabId];
  if (!s || s.col !== col) return '';
  return s.dir === 'asc' ? 'sorted-asc' : 'sorted-desc';
}

// ── FORMAT HELPERS ──
function fmt$(n) {
  if (n === null || n === undefined || n === '') return '—';
  return '$' + parseFloat(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtNum(n) {
  if (n === null || n === undefined || n === '') return '—';
  return parseFloat(n).toLocaleString('en-US');
}
function sumField(arr, field) {
  return arr.reduce((s, r) => s + (parseFloat(r[field]) || 0), 0);
}

// ── INV SHEETS ──
function renderInvSheets() {
  const tabId = 'inv-sheets';
  const search = getSearch(tabId);
  const gaugeFilter = getFilter(tabId, 'gauge');
  const vendorFilter = getFilter(tabId, 'vendor');
  const typeFilter = getFilter(tabId, 'type'); // sheets or coil

  let rows = state.invSheets.filter(r => {
    if (gaugeFilter && r.gauge !== gaugeFilter) return false;
    if (vendorFilter && r.vendor !== vendorFilter) return false;
    if (typeFilter === 'sheet' && r.size && r.size.includes('x') === false) return false;
    if (typeFilter === 'coil' && r.size && r.size.includes('x')) return false;
    if (search) {
      const hay = [r.section, r.gauge, r.size, r.vendor, r.bundle, r.bundleNum].join(' ').toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  const sorted = state.sortState[tabId]?.col
    ? sortData(rows, state.sortState[tabId].col, state.sortState[tabId].dir)
    : rows;

  // Unique values for filters
  const gauges = [...new Set(state.invSheets.map(r => r.gauge).filter(Boolean))].sort((a,b) => parseFloat(a)-parseFloat(b));
  const vendors = [...new Set(state.invSheets.map(r => r.vendor).filter(Boolean))].sort();

  const totalVal = sumField(rows, 'total');
  const totalPcs = rows.reduce((s,r) => s + (parseInt(r.pcs) || 0), 0);
  const sheetRows = rows.filter(r => r.size && r.size.includes('x'));
  const coilRows = rows.filter(r => r.size && !r.size.includes('x'));

  // Group by section if no sort applied and no search
  const useGrouped = !state.sortState[tabId]?.col && !search && !gaugeFilter && !vendorFilter && !typeFilter;

  let tbody = '';
  if (useGrouped) {
    let lastSection = null;
    sorted.forEach((r, i) => {
      const origIdx = state.invSheets.indexOf(r);
      if (r.section !== lastSection) {
        const secRows = state.invSheets.filter(x => x.section === r.section);
        const secTotal = sumField(secRows, 'total');
        tbody += `<tr class="section-header"><td colspan="9">${r.section} <span style="font-weight:400;color:var(--text-secondary);font-size:11px;margin-left:8px">${secRows.length} items · ${fmt$(secTotal)}</span></td></tr>`;
        lastSection = r.section;
      }
      tbody += invSheetRow(r, origIdx);
    });
  } else {
    sorted.forEach(r => {
      const origIdx = state.invSheets.indexOf(r);
      tbody += invSheetRow(r, origIdx);
    });
  }

  const html = `
    <div class="summary-row">
      <div class="summary-card accent">
        <div class="card-label">Total Value</div>
        <div class="card-value">${fmt$(sumField(state.invSheets,'total'))}</div>
        <div class="card-sub">${state.invSheets.length} line items</div>
      </div>
      <div class="summary-card">
        <div class="card-label">Filtered Value</div>
        <div class="card-value">${fmt$(totalVal)}</div>
        <div class="card-sub">${rows.length} rows shown</div>
      </div>
      <div class="summary-card">
        <div class="card-label">Sheets</div>
        <div class="card-value">${fmtNum(sumField(sheetRows,'pcs'))}</div>
        <div class="card-sub">${sheetRows.length} line items</div>
      </div>
      <div class="summary-card">
        <div class="card-label">Coil Bundles</div>
        <div class="card-value">${coilRows.length}</div>
        <div class="card-sub">coil stock lines</div>
      </div>
    </div>

    <div class="toolbar">
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-input" type="text" placeholder="Search gauge, size, vendor, bundle…"
          value="${state.search[tabId] || ''}"

      </div>
      <select class="filter-select" onchange="setFilter('inv-sheets','gauge',this.value)">
        <option value="">All Gauges</option>
        ${gauges.map(g => `<option value="${g}" ${gaugeFilter===g?'selected':''}>${g} Gauge</option>`).join('')}
      </select>
      <select class="filter-select" onchange="setFilter('inv-sheets','vendor',this.value)">
        <option value="">All Vendors</option>
        ${vendors.map(v => `<option value="${v}" ${vendorFilter===v?'selected':''}>${v}</option>`).join('')}
      </select>
      <select class="filter-select" onchange="setFilter('inv-sheets','type',this.value)">
        <option value="">Sheets + Coil</option>
        <option value="sheet" ${typeFilter==='sheet'?'selected':''}>Sheets Only</option>

// ── INLINE EDIT ──
function startEdit(td, stateKey, rowIdx, field) {
  const current = state[stateKey][rowIdx][field];
  const input = document.createElement('input');
  input.type = 'number';
  input.className = 'editing-input';
  input.value = current ?? '';
  input.min = 0;
  td.innerHTML = '';
  td.appendChild(input);
  input.focus();
  input.select();

  function commit() {
    const val = parseFloat(input.value);
    if (!isNaN(val) && val !== current) {
      if (!state.modifications[stateKey]) state.modifications[stateKey] = {};
      state.modifications[stateKey][rowIdx] = { ...(state.modifications[stateKey][rowIdx] || {}), [field]: val };
      state[stateKey][rowIdx][field] = val;
      // Recalculate total if possible
      const r = state[stateKey][rowIdx];
      if (field === 'pcs' && r.price) {
        state[stateKey][rowIdx].total = Math.round(val * r.price * 100) / 100;
      }
      if (field === 'coils' && r.weight && r.price) {
        // for slip drive, total is weight-based, leave as is
      }
      showSaveBar(Object.values(state.modifications).reduce((s,o) => s + Object.keys(o).length, 0));
    }
    renderTab(state.currentTab);
  }

  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { input.blur(); }
    if (e.key === 'Escape') { renderTab(state.currentTab); }
  });
}

// ── SAVE BAR ──

// ── EXPORT CSV ──
function exportTab(tabId) {
  const dataKey = TAB_KEYS[tabId];
  const rows = state[dataKey];
  if (!rows || !rows.length) return;
  const keys = Object.keys(rows[0]);
  const csv = [keys.join(','), ...rows.map(r =>
    keys.map(k => {
      const v = r[k] ?? '';
      return typeof v === 'string' && (v.includes(',') || v.includes('"')) ? `"${v.replace(/"/g,'""')}"` : v;
    }).join(',')
  )].join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `sherwood-${tabId}-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

// ── IMPORT EXCEL ──
document.getElementById('file-input').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const wb = XLSX.read(ev.target.result, { type: 'array', cellDates: true });
      importFromWorkbook(wb, file.name);
    } catch(err) {
      showToast('Failed to read file: ' + err.message, 'error');
    }
  };
  reader.readAsArrayBuffer(file);
  this.value = ''; // reset so same file can be re-imported
});

function importFromWorkbook(wb, filename) {
  // Try to find sheets by name (partial match)
  const sheetNames = wb.SheetNames;
  let imported = 0;

  const findSheet = (...names) => {
    for (const n of names) {
      const match = sheetNames.find(s => s.toLowerCase().includes(n.toLowerCase()));
      if (match) return wb.Sheets[match];
    }
    return null;
  };

  // Parse Inv - Sheets
  const invSheet = findSheet('inv', 'sheets');
  if (invSheet) {
    const parsed = parseInvSheets(invSheet);
    if (parsed.length > 0) { state.invSheets = parsed; imported++; }
  }

  const slipSheet = findSheet('slip', 'drive');
  if (slipSheet) {
    const parsed = parseSlipDrive(slipSheet);
    if (parsed.length > 0) { state.slipDrive = parsed; imported++; }
  }

  const alumSheet = findSheet('alum', 'stain');
  if (alumSheet) {
    const parsed = parseAlumStain(alumSheet);
    if (parsed.length > 0) { state.alumStain = parsed; imported++; }
  }

  const elgenSheet = findSheet('elgen');
  if (elgenSheet) {
    const parsed = parseElgen(elgenSheet);
    if (parsed.length > 0) { state.elgen = parsed; imported++; }
  }

  const mjsSheet = findSheet('mjs', 'consign');
  if (mjsSheet) {
    const parsed = parseMJS(mjsSheet);
    if (parsed.length > 0) { state.mjsConsignment = parsed; imported++; }
  }

  if (imported === 0) {
    showToast('No matching sheets found in file', 'error');
    return;
  }

  state.modifications = {};
  persistToStorage();
  updateBadges();
  renderTab(state.currentTab);
  const ts = new Date().toLocaleDateString('en-US',{month:'numeric',day:'numeric',year:'2-digit',hour:'numeric',minute:'2-digit'});
  document.getElementById('last-updated-label').textContent = `Imported: ${filename.split('/').pop()} · ${ts}`;
  showToast(`Imported ${imported} sheets from ${filename}`, 'success');
}

// ── SHEET PARSERS ──
function sheetToRows(ws) {
  return XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: false });
}

function parseInvSheets(ws) {
  const rows = sheetToRows(ws);
  const results = [];
  let section = '';
  // Header row detection: look for 'gauge' or 'size' in first few rows
  let headerIdx = -1;
  for (let i = 0; i < Math.min(10, rows.length); i++) {
    const r = rows[i].map(c => String(c||'').toLowerCase());
    if (r.some(c => c.includes('gauge')) || r.some(c => c.includes('size'))) {
      headerIdx = i; break;
    }
  }
  if (headerIdx < 0) return [];
  const headers = rows[headerIdx].map(c => String(c||'').trim().toLowerCase());
  const colIdx = (names) => {
    for (const n of names) {
      const i = headers.findIndex(h => h.includes(n));
      if (i >= 0) return i;
    }
    return -1;
  };
  const iGauge = colIdx(['gauge']);
  const iSize = colIdx(['size']);
  const iVendor = colIdx(['vendor']);
  const iPcs = colIdx(['pcs','pieces','qty','count']);
  const iBundle = colIdx(['bundle type','bundle']);
  const iBundleNum = colIdx(['bundle #','bundle#','bundlenum','bundle n']);
  const iPrice = colIdx(['price']);
  const iTotal = colIdx(['total','ext']);

  for (let i = headerIdx + 1; i < rows.length; i++) {
    const row = rows[i];
    if (!row || row.every(c => !c)) continue;
    // Section header: non-empty first cell, no gauge value, no pcs
    const firstCell = String(row[0] || '').trim();
    const gaugeVal = iGauge >= 0 ? String(row[iGauge] || '').trim() : '';
    const pcsVal = iPcs >= 0 ? row[iPcs] : null;
    if (firstCell && !gaugeVal && !pcsVal && firstCell.toLowerCase().includes('gauge')) {
      section = firstCell; continue;
    }
    if (!gaugeVal && !pcsVal) continue;
    const price = parseFloat(String(row[iPrice] || '').replace(/[$,]/g,'')) || 0;
    const total = parseFloat(String(row[iTotal] || '').replace(/[$,]/g,'')) || 0;
    results.push({
      section,
      gauge: gaugeVal,
      size: iSize >= 0 ? String(row[iSize] || '').trim() : '',
      vendor: iVendor >= 0 ? String(row[iVendor] || '').trim() : '',
      pcs: parseInt(pcsVal) || 0,
      bundle: iBundle >= 0 ? String(row[iBundle] || '').trim() : '',
      bundleNum: iBundleNum >= 0 ? String(row[iBundleNum] || '').trim() : '',
      price, total
    });
  }
  return results;
}

function parseSlipDrive(ws) {
  const rows = sheetToRows(ws);
  const results = [];
  let headerIdx = -1;
  for (let i = 0; i < Math.min(10, rows.length); i++) {
    const r = rows[i].map(c => String(c||'').toLowerCase());
    if (r.some(c => c.includes('gauge'))) { headerIdx = i; break; }
  }
  if (headerIdx < 0) return [];
  const headers = rows[headerIdx].map(c => String(c||'').trim().toLowerCase());
  const g = headers.findIndex(h => h.includes('gauge'));
  const sz = headers.findIndex(h => h.includes('size') || h.includes('width'));
  const vd = headers.findIndex(h => h.includes('vendor'));
  const co = headers.findIndex(h => h.includes('coil') || h.includes('qty'));
  const bn = headers.findIndex(h => h.includes('bundle'));
  const wt = headers.findIndex(h => h.includes('weight') || h.includes('lbs'));
  const pr = headers.findIndex(h => h.includes('price'));
  const to = headers.findIndex(h => h.includes('total') || h.includes('ext'));
  for (let i = headerIdx + 1; i < rows.length; i++) {
    const row = rows[i];
    if (!row || row.every(c => !c)) continue;
    const gaugeVal = g >= 0 ? String(row[g]||'').trim() : '';
    if (!gaugeVal) continue;
    results.push({
      gauge: gaugeVal,

      price: pr >= 0 ? parseFloat(String(row[pr]||'').replace(/[$,]/g,'')) || 0 : 0,
      total: to >= 0 ? parseFloat(String(row[to]||'').replace(/[$,]/g,'')) || 0 : 0
    });
  }
  return results;
}

function parseAlumStain(ws) {
  const rows = sheetToRows(ws);

  for (let i = 0; i < Math.min(10, rows.length); i++) {

  const tp = headers.findIndex(h => h.includes('type'));

  const to = headers.findIndex(h => h.includes('total'));
  for (let i = headerIdx + 1; i < rows.length; i++) {

    if (!row || row.every(c => !c)) continue;
    const typeVal = tp >= 0 ? String(row[tp]||'').trim().toUpperCase() : '';

    const gaugeVal = g >= 0 ? String(row[g]||'').trim() : '';
    if (!gaugeVal) continue;
    results.push({
      type: typeVal || type,
      gauge: gaugeVal,
      size: sz >= 0 ? String(row[sz]||'').trim() : '',
      vendor: vd >= 0 ? String(row[vd]||'').trim() : '',

      total: to >= 0 ? parseFloat(String(row[to]||'').replace(/[$,]/g,'')) || 0 : 0
    });
  }
  return results;

function parseMJS(ws) {
  const rows = sheetToRows(ws);
  const results = [];
  let headerIdx = -1;
  for (let i = 0; i < Math.min(15, rows.length); i++) {
    const r = rows[i].map(c => String(c||'').toLowerCase());
    if (r.some(c => c.includes('heat') || c.includes('gauge') || c.includes('mjs'))) { headerIdx = i; break; }
  }
  if (headerIdx < 0) return [];
  const headers = rows[headerIdx].map(c => String(c||'').trim().toLowerCase());
  const g = headers.findIndex(h => h.includes('gauge'));
  const w = headers.findIndex(h => h.includes('width'));
  const co = headers.findIndex(h => h.includes('coating') || h.includes('coat'));
  const hn = headers.findIndex(h => h.includes('heat'));
  const mt = headers.findIndex(h => h.includes('mjs') && h.includes('tag'));
  const lf = headers.findIndex(h => h.includes('lf') || h.includes('lin'));
  const wt = headers.findIndex(h => h.includes('weight') || h.includes('lbs'));
  const cd = headers.findIndex(h => h.includes('cpl') || h.includes('date'));
  const pr = headers.findIndex(h => h.includes('price'));
  const tg = headers.findIndex(h => h.includes('tag') && !h.includes('mjs'));
  for (let i = headerIdx + 1; i < rows.length; i++) {
    const row = rows[i];
    if (!row || row.every(c => !c)) continue;
    const wt_val = wt >= 0 ? parseFloat(String(row[wt]||'').replace(/,/g,'')) || 0 : 0;
    const lf_val = lf >= 0 ? parseFloat(String(row[lf]||'').replace(/,/g,'')) || 0 : 0;
    if (!wt_val && !lf_val) continue; // skip empty/header rows
    // Skip rows with a use date (they've moved to inv-sheets)
    // We just import all without use date; if the Excel is filtered, it will just show those
    results.push({
      gauge: g >= 0 ? String(row[g]||'').trim() : '',
      width: w >= 0 ? String(row[w]||'').trim() : '',
      coating: co >= 0 ? String(row[co]||'').trim() : '',
      heatNum: hn >= 0 ? String(row[hn]||'').trim() : '',
      mjsTag: mt >= 0 ? String(row[mt]||'').trim() : '',
      lf: lf_val,
      weight: wt_val,
      cplDate: cd >= 0 ? String(row[cd]||'').trim() : '',
      price: pr >= 0 ? parseFloat(String(row[pr]||'').replace(/[$,]/g,'')) || 0 : 0,
      tag: tg >= 0 ? String(row[tg]||'').trim() : ''
    });
  }
  return results;
}

// ── TOAST ──
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (type ? ' ' + type : '');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ── START ──
init();
</script>
