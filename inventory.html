<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sherwood Steel — Inventory</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --forest:#1C2E1C;--forest-mid:#2D6A2D;--forest-light:#3D7A3D;
    --sage:#A8D5A8;--sage-dim:#7AB87A;--cream:#F0F4F0;--white:#FFFFFF;
    --steel-light:#C8D8D4;--rust:#C94F2A;--amber:#D4891A;
    --text-primary:#1A2A1A;--text-secondary:#4A6A4A;--text-muted:#7A9A7A;
    --border:#D0DDD0;--border-dark:#A8C0A8;--row-alt:#F5FAF5;
    --row-hover:#EBF5EB;--shadow:rgba(28,46,28,0.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--cream);color:var(--text-primary);min-height:100vh;}
  #login-overlay{position:fixed;inset:0;z-index:99999;background:var(--forest);display:flex;align-items:center;justify-content:center;}
  .login-card{background:var(--white);border-radius:12px;padding:40px;width:340px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.4);}
  .login-card .brand{font-size:22px;font-weight:800;color:var(--forest);margin-bottom:4px;}
  .login-card .sub{font-size:12px;color:var(--text-muted);margin-bottom:28px;letter-spacing:1px;text-transform:uppercase;}
  .login-card input[type=password]{width:100%;padding:11px 14px;font-size:14px;border:2px solid var(--border-dark);border-radius:8px;margin-bottom:12px;outline:none;font-family:inherit;}
  .login-card input:focus{border-color:var(--forest-mid);}
  .login-card button{width:100%;padding:12px;font-size:14px;font-weight:700;background:var(--forest-mid);color:var(--white);border:none;border-radius:8px;cursor:pointer;}
  .login-card button:hover{background:var(--forest-light);}
  .login-error{color:var(--rust);font-size:12px;margin-top:10px;display:none;}
  .app-header{background:var(--forest);color:var(--white);padding:0 24px;display:flex;align-items:center;gap:16px;height:56px;box-shadow:0 2px 8px var(--shadow);position:sticky;top:0;z-index:100;}
  .logo{font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--sage);}
  .page-title{font-size:15px;font-weight:600;opacity:.9;}
  .hdiv{width:1px;height:24px;background:rgba(168,213,168,.3);}
  .hspace{flex:1;}
  .sync-status{font-size:11px;padding:3px 8px;border-radius:4px;font-weight:600;}
  .sync-ok{background:rgba(168,213,168,.2);color:var(--sage);}
  .sync-saving{background:rgba(212,137,26,.2);color:#f5c842;}
  .sync-err{background:rgba(201,79,42,.2);color:#ff8a7a;}
  .btn-import{display:flex;align-items:center;gap:7px;background:var(--forest-mid);color:var(--white);border:1px solid var(--forest-light);padding:7px 14px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .btn-import:hover{background:var(--forest-light);}
  .btn-sm{padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border-dark);background:var(--white);color:var(--text-secondary);}
  .btn-sm:hover{background:var(--row-hover);}
  .tab-bar{background:var(--forest);border-bottom:2px solid var(--forest-mid);display:flex;padding:0 24px;gap:2px;overflow-x:auto;}
  .tab-btn{background:none;border:none;color:rgba(168,213,168,.65);padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;}
  .tab-btn:hover{color:var(--sage);}
  .tab-btn.active{color:var(--sage);border-bottom-color:var(--sage);}
  .tab-badge{display:inline-block;background:rgba(168,213,168,.18);color:var(--sage-dim);font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:5px;}
  .tab-btn.active .tab-badge{background:rgba(168,213,168,.3);color:var(--sage);}
  .main{padding:20px 24px 40px;max-width:1600px;margin:0 auto;}
  .summary-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px;}
  .summary-card{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:14px 16px;box-shadow:0 1px 3px var(--shadow);}
  .summary-card .cl{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-muted);margin-bottom:5px;}
  .summary-card .cv{font-size:22px;font-weight:700;color:var(--forest);line-height:1;}
  .summary-card .cs{font-size:11px;color:var(--text-secondary);margin-top:4px;}
  .summary-card.accent{background:var(--forest);border-color:var(--forest-mid);}
  .summary-card.accent .cl{color:var(--sage-dim);}
  .summary-card.accent .cv{color:var(--sage);}
  .summary-card.accent .cs{color:rgba(168,213,168,.7);}
  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .search-wrap{position:relative;flex:1;min-width:200px;max-width:380px;}
  .search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none;}
  .search-input{width:100%;padding:8px 10px 8px 34px;border:1px solid var(--border-dark);border-radius:6px;font-size:13px;background:var(--white);outline:none;}
  .search-input:focus{border-color:var(--forest-mid);}
  .filter-select{padding:8px 10px;border:1px solid var(--border-dark);border-radius:6px;font-size:13px;background:var(--white);outline:none;cursor:pointer;}
  .toolbar-right{margin-left:auto;}
  .table-wrap{background:var(--white);border:1px solid var(--border);border-radius:8px;overflow:hidden;box-shadow:0 1px 4px var(--shadow);}
  .table-container{overflow-x:auto;max-height:calc(100vh - 320px);overflow-y:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead{position:sticky;top:0;z-index:10;}
  thead th{background:var(--forest);color:var(--sage);padding:10px 12px;text-align:left;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;white-space:nowrap;cursor:pointer;user-select:none;}
  thead th:hover{background:var(--forest-mid);}
  thead th.sorted-asc::after{content:' ▲';font-size:9px;}
  thead th.sorted-desc::after{content:' ▼';font-size:9px;}
  tbody tr{border-bottom:1px solid var(--border);}
  tbody tr:nth-child(even){background:var(--row-alt);}
  tbody tr:hover{background:var(--row-hover);}
  tbody tr.section-header{background:#E8F0E8;}
  tbody tr.section-header td{font-weight:700;color:var(--forest);font-size:12px;padding:8px 12px 6px;border-bottom:2px solid var(--border-dark);}
  tbody td{padding:9px 12px;white-space:nowrap;}
  .td-num{text-align:right;font-variant-numeric:tabular-nums;}
  .td-money{text-align:right;font-variant-numeric:tabular-nums;color:var(--forest);font-weight:600;}
  .td-total{text-align:right;font-variant-numeric:tabular-nums;color:var(--forest-mid);font-weight:700;}
  .vendor-badge{display:inline-block;background:var(--forest);color:var(--sage);font-size:10px;font-weight:700;padding:2px 7px;border-radius:3px;}
  .gauge-chip{display:inline-block;background:var(--steel-light);color:var(--forest);font-size:11px;font-weight:700;padding:2px 7px;border-radius:3px;}
  .table-footer{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--border);background:var(--row-alt);font-size:12px;color:var(--text-secondary);}
  .table-footer strong{color:var(--forest);}
  .empty-state{padding:60px 20px;text-align:center;color:var(--text-muted);}
  .empty-state .icon{font-size:48px;margin-bottom:12px;}
  .empty-state p{font-size:14px;margin-bottom:8px;}
  .empty-state .hint{font-size:12px;}
  .pcs-input{width:70px;padding:3px 6px;border:1px solid var(--border-dark);border-radius:4px;font-size:12.5px;font-family:inherit;text-align:right;outline:none;background:var(--white);}
  .pcs-input:focus{border-color:var(--forest-mid);}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--forest);color:var(--white);padding:12px 18px;border-radius:8px;font-size:13px;font-weight:600;box-shadow:0 4px 16px var(--shadow);z-index:999;transform:translateY(80px);opacity:0;transition:all .25s ease;}
  .toast.show{transform:translateY(0);opacity:1;}
  .toast.error{background:var(--rust);}
  .toast.success{background:var(--forest-mid);}
  #file-input{display:none;}
</style>
</head>
<body>
<input type="file" id="file-input" accept=".xlsx,.xls">

<div id="login-overlay">
  <div class="login-card">
    <div class="brand">Sherwood Steel</div>
    <div class="sub">Inventory</div>
    <input type="password" id="login-pw" placeholder="Enter shop password" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Sign In</button>
    <div class="login-error" id="login-error">Incorrect password. Try again.</div>
  </div>
</div>

<header class="app-header" id="app-header" style="display:none">
  <span class="logo">Sherwood Steel</span>
  <div class="hdiv"></div>
  <span class="page-title">Inventory</span>
  <div class="hspace"></div>
  <span class="sync-status" id="sync-status" style="display:none"></span>
  <span id="last-updated" style="font-size:11px;color:var(--sage-dim);opacity:.8"></span>
  <button class="btn-import" onclick="document.getElementById('file-input').click()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    Import Excel
  </button>
  <button class="btn-sm" onclick="logout()">↩ Out</button>
</header>

<nav class="tab-bar" id="tab-bar" style="display:none">
  <button class="tab-btn active" onclick="switchTab('inv-sheets')" id="tab-inv-sheets">Inv. Sheets <span class="tab-badge" id="badge-inv-sheets">0</span></button>
  <button class="tab-btn" onclick="switchTab('slip-drive')" id="tab-slip-drive">Slip Drive <span class="tab-badge" id="badge-slip-drive">0</span></button>
  <button class="tab-btn" onclick="switchTab('alum-ss')" id="tab-alum-ss">Alum / SS <span class="tab-badge" id="badge-alum-ss">0</span></button>
  <button class="tab-btn" onclick="switchTab('elgen')" id="tab-elgen">Elgen <span class="tab-badge" id="badge-elgen">0</span></button>
  <button class="tab-btn" onclick="switchTab('mjs')" id="tab-mjs">MJS Consignment <span class="tab-badge" id="badge-mjs">0</span></button>
</nav>

<main class="main" id="app-main" style="display:none">
  <div id="tab-content-inv-sheets"></div>
  <div id="tab-content-slip-drive" style="display:none"></div>
  <div id="tab-content-alum-ss" style="display:none"></div>
  <div id="tab-content-elgen" style="display:none"></div>
  <div id="tab-content-mjs" style="display:none"></div>
</main>

<div class="toast" id="toast"></div>

<script>
const SB_URL='https://ecndvwmbycyppqkbvuzs.supabase.co';
const SB_KEY='sb_publishable_DPSLNDOI___sDI-lt3YbpQ_TGJbHaV-';
const SB_HDR={'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY};
const SESSION_KEY='kzn_session';
const SB_TABLES={
  invSheets:'inventory_sheets',
  slipDrive:'inventory_slip_drive',
  alumStain:'inventory_alum_stain',
  elgen:'inventory_elgen',
  mjsConsignment:'inventory_mjs_consignment'
};
const TAB_KEYS={'inv-sheets':'invSheets','slip-drive':'slipDrive','alum-ss':'alumStain','elgen':'elgen','mjs':'mjsConsignment'};

// ── AUTH ──
function isLoggedIn(){return localStorage.getItem(SESSION_KEY)==='authenticated';}
async function doLogin(){
  const pw=(document.getElementById('login-pw').value||'').trim();
  if(!pw)return;
  try{
    const r=await fetch(`${SB_URL}/rest/v1/admin_config?key=eq.shop_password&select=value`,{headers:SB_HDR});
    const cfg=await r.json();
    const stored=cfg&&cfg[0]?cfg[0].value:'sherwood';
    const correct=typeof stored==='string'?stored:JSON.stringify(stored).replace(/^"|"$/g,'');
    if(pw===correct){localStorage.setItem(SESSION_KEY,'authenticated');document.getElementById('login-overlay').remove();showApp();}
    else{document.getElementById('login-error').style.display='block';document.getElementById('login-pw').value='';}
  }catch(e){
    if(pw==='sherwood'){localStorage.setItem(SESSION_KEY,'authenticated');document.getElementById('login-overlay').remove();showApp();}
    else{document.getElementById('login-error').textContent='Cannot reach server.';document.getElementById('login-error').style.display='block';}
  }
}
function logout(){localStorage.removeItem(SESSION_KEY);location.reload();}
function showApp(){['app-header','tab-bar','app-main'].forEach(id=>document.getElementById(id).style.display='');init();}

// ── SUPABASE ──
async function sbGet(table,params=''){
  try{const r=await fetch(`${SB_URL}/rest/v1/${table}${params?'?'+params:''}`,{headers:SB_HDR});if(!r.ok)return null;return await r.json();}
  catch(e){return null;}
}
async function sbUpsert(table,body){
  try{const r=await fetch(`${SB_URL}/rest/v1/${table}`,{method:'POST',headers:{...SB_HDR,'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(body)});
  if(!r.ok){const txt=await r.text();console.error('sbUpsert '+table+' '+r.status+':',txt);return false;}
  return true;}
  catch(e){console.error('sbUpsert '+table+' exception:',e);return false;}
}
async function sbDelete(table,bundleNum){
  try{const r=await fetch(`${SB_URL}/rest/v1/${table}?bundle_num=eq.${encodeURIComponent(bundleNum)}`,{method:'DELETE',headers:{...SB_HDR,'Prefer':'return=minimal'}});return r.ok;}
  catch(e){return false;}
}
async function sbPatch(table,bundleNum,body){
  try{const r=await fetch(`${SB_URL}/rest/v1/${table}?bundle_num=eq.${encodeURIComponent(bundleNum)}`,{method:'PATCH',headers:{...SB_HDR,'Prefer':'return=minimal'},body:JSON.stringify(body)});return r.ok;}
  catch(e){return false;}
}

// ── STATE ──
let state={invSheets:[],slipDrive:[],alumStain:[],elgen:[],mjsConsignment:[],currentTab:'inv-sheets',sortState:{},search:{},filters:{}};

// ── INIT ──
async function init(){
  setSyncStatus('loading');
  await loadFromSupabase();
  renderAll();
}

async function loadFromSupabase(){
  let hasData=false;
  for(const [key,table] of Object.entries(SB_TABLES)){
    const rows=await sbGet(table,'select=bundle_num,data&order=data->>section.asc,data->>gauge.asc');
    if(rows&&rows.length>0){
      // Only show rows with pcs > 0
      state[key]=rows.map(r=>r.data).filter(d=>parseInt(d.pcs||d.coils||d.weight||1)>0);
      hasData=true;
    } else state[key]=[];
  }
  if(hasData){setSyncStatus('ok');setLabel('Loaded from Supabase');}
  else{setSyncStatus('empty');setLabel('No inventory — import Excel to load');}
}

// ── RECONCILIATION IMPORT ──
async function reconcileImport(parsedData, fname){
  setSyncStatus('saving');
  const ts=new Date().toISOString();
  let added=0,updated=0,archived=0;

  for(const [key,table] of Object.entries(SB_TABLES)){
    const newRows=parsedData[key]||[];

    // Build lookup of new data by bundleNum
    const newByBundle={};
    for(const row of newRows){
      const bn=String(row.mjsTag||row.bundleNum||row.heatNum||'').trim();
      if(bn) newByBundle[bn]=row;
    }

    // Get existing rows from Supabase
    const existing=await sbGet(table,'select=bundle_num,data');
    const existingByBundle={};
    if(existing) for(const r of existing) existingByBundle[r.bundle_num]=r.data;

    // Upsert all new/updated rows from Excel
    const upsertBatch=[];
    for(const row of newRows){
      const bn=String(row.mjsTag||row.bundleNum||row.heatNum||'').trim();
      if(!bn) continue;
      const qty=parseInt(row.pcs||row.coils||0)+(parseFloat(row.weight||row.lf||0));
      if(qty===0) continue; // skip zero rows from Excel
      upsertBatch.push({bundle_num:bn,data:row,updated_at:ts});
      if(existingByBundle[bn]) updated++; else added++;
    }
    // Upsert in batches
    for(let i=0;i<upsertBatch.length;i+=100){
      await sbUpsert(table,upsertBatch.slice(i,i+100));
    }

    // Archive bundles in Supabase not in new Excel
    const auditBatch=[];
    for(const [bn,data] of Object.entries(existingByBundle)){
      if(!newByBundle[bn]){
        auditBatch.push({tab:key,bundle_num:bn,data:{...data,pcs:0},reason:'import_removed',archived_at:ts});
        await sbDelete(table,bn);
        archived++;
      }
    }
    if(auditBatch.length>0) await sbUpsert('inventory_audit',auditBatch);
  }

  // Reload state from Supabase
  await loadFromSupabase();
  updateBadges();
  renderTab(state.currentTab);
  const msg=`Reconciled: +${added} new · ${updated} updated · ${archived} archived`;
  setLabel(msg);
  showToast(msg,'success');
}

// ── MANUAL PCS UPDATE ──
async function updatePcs(key,bundleNum,newPcs){
  const table=SB_TABLES[key];
  const row=state[key].find(r=>r.bundleNum===bundleNum||r.heatNum===bundleNum||r.mjsTag===bundleNum);
  if(!row)return;
  const qty=parseInt(newPcs)||0;
  if(qty===0){
    // Archive and remove
    const ts=new Date().toISOString();
    await sbUpsert('inventory_audit',[{tab:key,bundle_num:bundleNum,data:{...row,pcs:0},reason:'manual_zero',archived_at:ts}]);
    await sbDelete(table,bundleNum);
    state[key]=state[key].filter(r=>(r.bundleNum||r.heatNum||r.mjsTag)!==bundleNum);
    showToast(`Bundle ${bundleNum} archived (0 pcs)`,'success');
  } else {
    row.pcs=qty;
    if(row.price) row.total=Math.round(qty*row.price*100)/100;
    await sbPatch(table,bundleNum,{data:row,updated_at:new Date().toISOString()});
    showToast(`Bundle ${bundleNum} updated to ${qty} pcs`,'success');
  }
  updateBadges();
  renderTab(state.currentTab);
}

// ── TABS ──
function switchTab(tabId){
  state.currentTab=tabId;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+tabId).classList.add('active');
  document.querySelectorAll('[id^=tab-content-]').forEach(c=>c.style.display='none');
  document.getElementById('tab-content-'+tabId).style.display='';
  renderTab(tabId);
}
function renderAll(){updateBadges();renderTab(state.currentTab);}
function updateBadges(){
  document.getElementById('badge-inv-sheets').textContent=state.invSheets.length;
  document.getElementById('badge-slip-drive').textContent=state.slipDrive.length;
  document.getElementById('badge-alum-ss').textContent=state.alumStain.length;
  document.getElementById('badge-elgen').textContent=state.elgen.length;
  document.getElementById('badge-mjs').textContent=state.mjsConsignment.length;
}
function renderTab(tabId){
  switch(tabId){
    case 'inv-sheets':renderInvSheets();break;
    case 'slip-drive':renderSlipDrive();break;
    case 'alum-ss':renderAlumSS();break;
    case 'elgen':renderElgen();break;
    case 'mjs':renderMJS();break;
  }
}

// ── HELPERS ──
function getSearch(t){return(state.search[t]||'').toLowerCase();}
function setSearch(t,v){state.search[t]=v;renderTab(t);}
function getFilter(t,f){return state.filters[t]?.[f]||'';}
function setFilter(t,f,v){if(!state.filters[t])state.filters[t]={};state.filters[t][f]=v;renderTab(t);}
function sortData(arr,col,dir){return[...arr].sort((a,b)=>{let av=a[col]??'',bv=b[col]??'';if(typeof av==='number'&&typeof bv==='number')return dir==='asc'?av-bv:bv-av;return dir==='asc'?String(av).localeCompare(String(bv)):String(bv).localeCompare(String(av));});}
function toggleSort(t,col){if(!state.sortState[t])state.sortState[t]={};const c=state.sortState[t];c.dir=c.col===col?(c.dir==='asc'?'desc':'asc'):'asc';c.col=col;renderTab(t);}
function sortClass(t,col){const s=state.sortState[t];if(!s||s.col!==col)return'';return s.dir==='asc'?'sorted-asc':'sorted-desc';}
function fmt$(n){if(n==null||n==='')return'—';return'$'+parseFloat(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtNum(n){if(n==null||n==='')return'—';return parseFloat(n).toLocaleString('en-US');}
function sumField(arr,f){return arr.reduce((s,r)=>s+(parseFloat(r[f])||0),0);}
function emptyState(cols){return`<tr><td colspan="${cols}"><div class="empty-state"><div class="icon">📦</div><p>No inventory data</p><div class="hint">Use Import Excel to load inventory</div></div></td></tr>`;}

// ── INV SHEETS ──
function renderInvSheets(){
  const tid='inv-sheets',search=getSearch(tid),gaugeF=getFilter(tid,'gauge'),vendorF=getFilter(tid,'vendor'),typeF=getFilter(tid,'type');
  let rows=state.invSheets.filter(r=>{
    if(gaugeF&&r.gauge!==gaugeF)return false;
    if(vendorF&&r.vendor!==vendorF)return false;
    if(typeF==='sheet'&&!(r.size||'').includes('x'))return false;
    if(typeF==='coil'&&(r.size||'').includes('x'))return false;
    if(search){const h=[r.section,r.gauge,r.size,r.vendor,r.bundle,r.bundleNum].join(' ').toLowerCase();if(!h.includes(search))return false;}
    return true;
  });
  const sorted=state.sortState[tid]?.col?sortData(rows,state.sortState[tid].col,state.sortState[tid].dir):rows;
  const gauges=[...new Set(state.invSheets.map(r=>r.gauge).filter(Boolean))].sort((a,b)=>parseFloat(a)-parseFloat(b));
  const vendors=[...new Set(state.invSheets.map(r=>r.vendor).filter(Boolean))].sort();
  const totalVal=sumField(rows,'total');
  const sheetRows=rows.filter(r=>(r.size||'').includes('x'));
  const coilRows=rows.filter(r=>!(r.size||'').includes('x'));

document.getElementById('file-input').addEventListener('change',async function(e){
  const file=e.target.files[0];if(!file)return;
  setSyncStatus('saving');setLabel('Parsing '+file.name+'…');
  const reader=new FileReader();
  reader.onload=async ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:'array',cellDates:true});
      await importFromWorkbook(wb,file.name);
    }catch(err){showToast('Failed: '+err.message,'error');setSyncStatus('err');}
  };
  reader.readAsArrayBuffer(file);
  this.value='';
});

async function importFromWorkbook(wb,fname){
  const findSheet=(...names)=>{
    // Explicitly exclude known legacy/hidden sheet names
    const EXCLUDE=new Set(['Dashboard','Forecast','SlipDrive','Elgen','ALUM - STAIN','MJS Con']);
    const pool=wb.SheetNames.filter(s=>!EXCLUDE.has(s));
    const all=pool.filter(s=>names.every(n=>s.toLowerCase().includes(n.toLowerCase())));
    if(all.length===1)return wb.Sheets[all[0]];
    if(all.length>1){const best=all.reduce((a,b)=>a.length<=b.length?a:b);return wb.Sheets[best];}
    for(const n of names){
      const matches=pool.filter(s=>s.toLowerCase().includes(n.toLowerCase()));
      if(matches.length===1)return wb.Sheets[matches[0]];
      if(matches.length>1){const best=matches.reduce((a,b)=>a.length<=b.length?a:b);return wb.Sheets[best];}
    }
    return null;
  };

  const parsed={
    invSheets:   parseInvSheets(findSheet('inv','sheets')),
    slipDrive:   parseSlipDrive(findSheet('slip drive','slip','drive')),
    alumStain:   parseAlumStain(findSheet('alum-stain','alum','stain')),
    elgen:       parseElgen(findSheet('elgen inv','elgen')),
    mjsConsignment: parseMJS(findSheet('mjs consignment','mjs','consignment'))
  };

  const totalParsed=Object.values(parsed).reduce((s,a)=>s+a.length,0);
  if(totalParsed===0){showToast('No data found in file','error');setSyncStatus('err');return;}

  await reconcileImport(parsed,fname);
}

// ── PARSERS ──
function sheetToRows(ws){return ws?XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:false}):[];}
function findHeader(rows){for(let i=0;i<Math.min(10,rows.length);i++){const r=rows[i].map(c=>String(c||'').toLowerCase());if(r.some(c=>c.includes('gauge')||c.includes('size')))return i;}return -1;}
function colIdx(headers,...names){for(const n of names){const i=headers.findIndex(h=>h.includes(n));if(i>=0)return i;}return -1;}

function parseInvSheets(ws){
  const rows=sheetToRows(ws),hi=findHeader(rows);if(hi<0)return[];
  const h=rows[hi].map(c=>String(c||'').trim().toLowerCase());
  const g=colIdx(h,'gauge'),sz=colIdx(h,'size'),vd=colIdx(h,'vendor','vndr'),pc=colIdx(h,'pcs','pieces','qty','pcs.');
  const pr=colIdx(h,'price'),to=colIdx(h,'total','ext');
  const bn=4;   // col E = bundle type (no header)
  const bnum=colIdx(h,'bundle #','bundle#','bundlenum','bundle n');
  const res=[];let sec='';
  for(let i=hi+1;i<rows.length;i++){
    const row=rows[i];if(!row||row.every(c=>!c))continue;
    const fc=String(row[0]||'').trim();
    const fc2=String(row[1]||'').trim().toLowerCase();
    if(fc.toLowerCase()==='total')continue;
    if(fc2.includes('total'))continue;
    const gv=g>=0?String(row[g]||'').trim():'',pv=pc>=0?row[pc]:null;
    if(fc&&!gv&&!pv&&fc.toLowerCase().includes('gauge')){sec=fc;continue;}
    if(!gv&&!pv)continue;
    let bundleNum=bnum>=0?String(row[bnum]||'').trim():'';
    if(!bundleNum){
      // Generate a stable key for rows without a bundle number
      bundleNum=`${gv}-${(sz>=0?String(row[sz]||''):'')+''}-${vd>=0?String(row[vd]||''):''}`.replace(/\s+/g,'-').replace(/[^a-zA-Z0-9-]/g,'').toLowerCase()+`-nobundle-${i}`;
      if(!bundleNum||bundleNum==='-nobundle')continue;
    }
    res.push({section:sec,gauge:gv,size:sz>=0?String(row[sz]||'').trim():'',vendor:vd>=0?String(row[vd]||'').trim():'',pcs:parseInt(pv)||0,bundle:String(row[bn]||'').trim(),bundleNum,price:pr>=0?parseFloat(String(row[pr]||'').replace(/[$,]/g,''))||0:0,total:to>=0?parseFloat(String(row[to]||'').replace(/[$,]/g,''))||0:0});
  }
  return res;
}

function parseSlipDrive(ws){
  const rows=sheetToRows(ws),hi=findHeader(rows);if(hi<0)return[];
  const h=rows[hi].map(c=>String(c||'').trim().toLowerCase());
  const g=colIdx(h,'gauge'),sz=colIdx(h,'size','width'),vd=colIdx(h,'vendor','vndr'),co=colIdx(h,'coil','qty','pcs'),bn=colIdx(h,'bundle'),wt=colIdx(h,'weight','lbs'),pr=colIdx(h,'price'),to=colIdx(h,'total','ext');
  const res=[];
  for(let i=hi+1;i<rows.length;i++){
    const row=rows[i];if(!row||row.every(c=>!c))continue;
    const gv=g>=0?String(row[g]||'').trim():'';if(!gv)continue;
    const bundleNum=bn>=0?String(row[bn]||'').trim():'';
    res.push({gauge:gv,size:sz>=0?String(row[sz]||'').trim():'',vendor:vd>=0?String(row[vd]||'').trim():'',coils:co>=0?parseInt(row[co])||0:0,bundleNum,weight:wt>=0?parseFloat(String(row[wt]||'').replace(/,/g,''))||0:0,price:pr>=0?parseFloat(String(row[pr]||'').replace(/[$,]/g,''))||0:0,total:to>=0?parseFloat(String(row[to]||'').replace(/[$,]/g,''))||0:0});
  }
  return res;
}

function parseAlumStain(ws){
  const rows=sheetToRows(ws);let hi=-1;
  for(let i=0;i<Math.min(10,rows.length);i++){const r=rows[i].map(c=>String(c||'').toLowerCase());if(r.some(c=>c.includes('gauge')||c.includes('type'))){hi=i;break;}}
  if(hi<0)return[];
  const h=rows[hi].map(c=>String(c||'').trim().toLowerCase());
  const tp=colIdx(h,'type'),g=colIdx(h,'gauge'),sz=colIdx(h,'size'),vd=colIdx(h,'vendor','vndr'),pc=colIdx(h,'pcs','qty'),dc=colIdx(h,'desc'),bn=colIdx(h,'bundle'),plb=colIdx(h,'/lb','per lb'),pea=colIdx(h,'/ea','per ea','price ea'),to=colIdx(h,'total');
  const res=[];let type='ALUM';
  for(let i=hi+1;i<rows.length;i++){
    const row=rows[i];if(!row||row.every(c=>!c))continue;
    const tv=tp>=0?String(row[tp]||'').trim().toUpperCase():'';
    if(tv&&(tv.includes('ALUM')||tv.includes('STAIN')||tv.includes('PERF')||tv.includes('DIAM')))type=tv;
    const gv=g>=0?String(row[g]||'').trim():'';if(!gv)continue;
    const bundleNum=bn>=0?String(row[bn]||'').trim():'';
    res.push({type:tv||type,gauge:gv,size:sz>=0?String(row[sz]||'').trim():'',vendor:vd>=0?String(row[vd]||'').trim():'',pcs:pc>=0?parseInt(row[pc])||0:0,desc:dc>=0?String(row[dc]||'').trim():'',bundleNum,pricePerLb:plb>=0?parseFloat(String(row[plb]||'').replace(/[$,]/g,''))||0:0,priceEa:pea>=0?parseFloat(String(row[pea]||'').replace(/[$,]/g,''))||0:0,total:to>=0?parseFloat(String(row[to]||'').replace(/[$,]/g,''))||0:0});
  }
  return res;
}

function parseElgen(ws){
  const rows=sheetToRows(ws);let hi=-1;
  for(let i=0;i<Math.min(10,rows.length);i++){const r=rows[i].map(c=>String(c||'').toLowerCase());if(r.some(c=>c.includes('desc')||c.includes('item'))){hi=i;break;}}
  if(hi<0)return[];
  const h=rows[hi].map(c=>String(c||'').trim().toLowerCase());
  const dc=colIdx(h,'desc','item','product'),vd=colIdx(h,'vendor','vndr'),pc=colIdx(h,'pcs','qty'),bn=colIdx(h,'bundle'),pk=colIdx(h,'pack'),lc=colIdx(h,'loc'),pr=colIdx(h,'price','cost'),to=colIdx(h,'total','ext');
  const res=[];
  for(let i=hi+1;i<rows.length;i++){
    const row=rows[i];if(!row||row.every(c=>!c))continue;
    const dv=dc>=0?String(row[dc]||'').trim():'';if(!dv)continue;
    const bundleNum=dv.replace(/\s+/g,'-').replace(/[^a-zA-Z0-9-]/g,'').toLowerCase();
    res.push({desc:dv,vendor:vd>=0?String(row[vd]||'').trim():'Elgen',pcs:pc>=0?parseInt(row[pc])||0:0,bundleNum,packaging:pk>=0?String(row[pk]||'').trim():'',loc:lc>=0?String(row[lc]||'').trim():'',price:pr>=0?parseFloat(String(row[pr]||'').replace(/[$,]/g,''))||0:0,total:to>=0?parseFloat(String(row[to]||'').replace(/[$,]/g,''))||0:0});
  }
  return res;
}

function parseMJS(ws){
  const rows=sheetToRows(ws);let hi=-1;
  for(let i=0;i<Math.min(15,rows.length);i++){const r=rows[i].map(c=>String(c||'').toLowerCase());if(r.some(c=>c.includes('heat')||c.includes('gauge')||c.includes('mjs'))){hi=i;break;}}
  if(hi<0)return[];
  const h=rows[hi].map(c=>String(c||'').trim().toLowerCase());
  const g=colIdx(h,'gauge'),w=colIdx(h,'width'),co=colIdx(h,'coating','coat'),hn=colIdx(h,'heat'),mt=h.findIndex(c=>c.includes('mjs')&&c.includes('tag')),lf=colIdx(h,'lf','lin'),wt=colIdx(h,'weight','lbs'),cd=colIdx(h,'cpl','date'),ud=colIdx(h,'use date','use_date','usedate'),pr=colIdx(h,'price'),tg=h.findIndex(c=>c.includes('tag')&&!c.includes('mjs'));
  const res=[];
  for(let i=hi+1;i<rows.length;i++){
    const row=rows[i];if(!row||row.every(c=>!c))continue;
    const wtv=wt>=0?parseFloat(String(row[wt]||'').replace(/,/g,''))||0:0;
    const lfv=lf>=0?parseFloat(String(row[lf]||'').replace(/,/g,''))||0:0;
    if(!wtv&&!lfv)continue;
    // Skip rows with a use date — those coils have been consumed and moved to Inv-Sheets
    if(ud>=0&&row[ud])continue;
    const heatNum=hn>=0?String(row[hn]||'').trim():'';
    const mjsTag=mt>=0?String(row[mt]||'').trim():'';
    if(!heatNum&&!mjsTag)continue; // skip summary/total rows
    const bundleNum=mjsTag||heatNum||`mjs-${i}`;
    res.push({gauge:g>=0?String(row[g]||'').trim():'',width:w>=0?String(row[w]||'').trim():'',coating:co>=0?String(row[co]||'').trim():'',heatNum,mjsTag,bundleNum,lf:lfv,weight:wtv,cplDate:cd>=0?String(row[cd]||'').trim():'',price:pr>=0?parseFloat(String(row[pr]||'').replace(/[$,]/g,''))||0:0,tag:tg>=0?String(row[tg]||'').trim():''});
  }
  return res;
}

// ── EXPORT ──
function exportTab(tabId){
  const rows=state[TAB_KEYS[tabId]];if(!rows?.length)return;
  const keys=Object.keys(rows[0]);
  const csv=[keys.join(','),...rows.map(r=>keys.map(k=>{const v=r[k]??'';return typeof v==='string'&&(v.includes(',')||v.includes('"'))?`"${v.replace(/"/g,'""')}"`:v;}).join(','))].join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`sherwood-${tabId}-${new Date().toISOString().slice(0,10)}.csv`;a.click();
}

// ── SYNC STATUS ──
function setSyncStatus(s){
  const el=document.getElementById('sync-status');if(!el)return;
  el.style.display='';el.className='sync-status';
  if(s==='ok'){el.className+=' sync-ok';el.textContent='✓ Synced';}
  else if(s==='saving'){el.className+=' sync-saving';el.textContent='↑ Saving…';}
  else if(s==='loading'){el.className+=' sync-saving';el.textContent='↓ Loading…';}
  else if(s==='empty'){el.style.display='none';}
  else if(s==='err'){el.className+=' sync-err';el.textContent='✗ Error';}
}
function setLabel(txt){const el=document.getElementById('last-updated');if(el)el.textContent=txt;}
function showToast(msg,type=''){const t=document.getElementById('toast');t.textContent=msg;t.className='toast'+(type?' '+type:'');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),4000);}

// ── BOOT ──
document.getElementById('login-pw').focus();
if(isLoggedIn()){document.getElementById('login-overlay').remove();showApp();}
